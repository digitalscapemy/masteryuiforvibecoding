<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mastering UI for Vibe Coding · Sign in</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cyan:#22E5FF;--blue:#3B82F6;--violet:#A855F7;--pink:#EC4899;--red:#EF4444;--muted:#8394BC;
  --f-head:'Montserrat',system-ui,sans-serif;--f-body:'Poppins',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:16px;font-family:var(--f-body);color:#fff;
  background:radial-gradient(900px 600px at 85% 0%,rgba(30,91,255,.35),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(91,31,209,.35),transparent 60%),linear-gradient(160deg,#050A1A,#0A1230)}
.card{width:100%;max-width:440px;padding:40px 36px;border-radius:24px;background:rgba(11,21,48,.85);border:1.5px solid rgba(120,160,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
.badge{display:inline-flex;align-items:center;gap:8px;font:800 12px var(--f-head);letter-spacing:.16em;color:var(--cyan);padding:7px 12px;border-radius:999px;border:1.5px solid rgba(34,229,255,.45);background:rgba(34,229,255,.08)}
.badge svg{width:14px;height:14px}
h1{margin:18px 0 6px;font:800 30px/1.15 var(--f-head)}
h1 span{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 26px;color:var(--muted);font-size:15px}
label{display:block;font:600 14px var(--f-head);color:#C3CEEA;margin-bottom:8px}
.field{display:flex;align-items:center;height:56px;border-radius:14px;background:#071027;border:1.5px solid rgba(120,160,255,.28);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,229,255,.18)}
.field.err{border-color:var(--red);box-shadow:0 0 0 4px rgba(239,68,68,.18)}
.field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:#fff;font:500 17px var(--f-body);padding:0 16px}
.eye{border:0;background:none;color:#8FA0C8;padding:0 14px;height:100%;cursor:pointer;display:grid;place-items:center}
.eye svg{width:22px;height:22px}
.msg{min-height:22px;margin:10px 2px 0;font-size:14px;color:var(--red)}
button.go{width:100%;height:56px;margin-top:12px;border:0;border-radius:14px;cursor:pointer;color:#fff;font:800 17px var(--f-head);background:linear-gradient(90deg,var(--blue),var(--violet));box-shadow:0 12px 30px rgba(59,130,246,.35);transition:filter .2s,transform .2s}
button.go:hover{filter:brightness(1.1);transform:translateY(-1px)}
button.go:disabled{opacity:.7;cursor:progress;transform:none}
.foot{margin-top:18px;font-size:13px;color:#61729B;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>PRIVATE DECK</span>
  <h1>Mastering UI for <span>Vibe Coding</span></h1>
  <p>Enter the password to open the slides.</p>
  <label for="pw">Password</label>
  <div class="field" id="fld">
    <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
    <button class="eye" type="button" id="eye" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="msg" id="msg" role="alert"></div>
  <button class="go" type="submit" id="go">Open Slides</button>
  <div class="foot">You stay signed in on this browser for 30 days.</div>
</form>
<script>
/* SHA-256 fallback for pages served over plain http (no crypto.subtle) */
function sha256Fallback(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes=[...new TextEncoder().encode(str)],bitLen=bytes.length*8;
  bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
  for(let i=7;i>=0;i--)bytes.push(i>3?0:(bitLen>>>(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r=(x,n)=>(x>>>n)|(x<<(32-n)),W=new Array(64);
  for(let o=0;o<bytes.length;o+=64){
    for(let i=0;i<16;i++)W[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3),s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    H=H.map((v,i)=>(v+[a,b,c,d,e,f,g,h][i])|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
async function sha256(str){
  if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  return sha256Fallback(str);
}
const COOKIE='deck_auth',DAYS=30;
const f=document.getElementById('f'),pw=document.getElementById('pw'),fld=document.getElementById('fld'),msg=document.getElementById('msg'),go=document.getElementById('go');
document.getElementById('eye').onclick=()=>{pw.type=pw.type==='password'?'text':'password';pw.focus()};
pw.oninput=()=>{fld.classList.remove('err');msg.textContent=''};
f.onsubmit=async e=>{
  e.preventDefault();if(!pw.value)return;
  go.disabled=true;go.textContent='Checking…';
  const token=await sha256('vbui:'+pw.value),secure=location.protocol==='https:'?'; Secure':'';
  document.cookie=`${COOKIE}=${token}; Max-Age=${DAYS*86400}; Path=/; SameSite=Lax${secure}`;
  let ok=false;try{ok=(await fetch('/auth-check',{cache:'no-store',credentials:'same-origin'})).status===204}catch(err){}
  if(ok){go.textContent='Opening…';location.reload();return}
  document.cookie=`${COOKIE}=; Max-Age=0; Path=/; SameSite=Lax${secure}`;
  fld.classList.add('err');msg.textContent='Wrong password. Please try again.';
  go.disabled=false;go.textContent='Open Slides';pw.select();
};
</script>
</body>
</html>
