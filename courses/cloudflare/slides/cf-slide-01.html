<!doctype html>
<html lang="en" data-slide="01">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudflare Gatekeeper for Vibe Coders</title>
<style data-src="assets/base.css">
/* Shared look for the Cloudflare series slides (black, white glass, orange accents).
   Same frame as the GitHub Power Skills deck, recoloured: --or replaces the GitHub green. */
:root{
  --bg:#000;--text:#fff;--body:#E8E8EC;--soft:#B9B9C2;--line:rgba(255,255,255,.78);
  --or:#F6821F;--or-soft:#FFB25E;--or-glow:rgba(246,130,31,.55);--or-dim:rgba(246,130,31,.12);
  --red:#F0373C;--red-glow:rgba(240,55,60,.55);
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.3,1.5,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;
  background:radial-gradient(1000px 600px at 70% 58%,rgba(246,130,31,.06),transparent 70%),
             radial-gradient(900px 560px at 30% 40%,rgba(255,255,255,.035),transparent 70%),var(--bg)}
.abs{position:absolute}
code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* header: the slide number is added by slide-no.js */
.label{position:absolute;left:72px;top:40px;display:flex;align-items:center;gap:26px;font-size:30px;font-weight:700;letter-spacing:-.015em}
.label span{animation:fadeRight .7s .25s var(--ease) both}
.label .part{color:var(--or-soft);font-weight:800}
.title{position:absolute;left:72px;top:104px;margin:0;font-size:80px;line-height:96px;font-weight:800;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;padding-bottom:6px}
.title > span{display:inline-block;animation:rise .9s .35s var(--ease) both}
.title em{font-style:normal;color:var(--or)}
.bar{position:absolute;left:74px;top:208px;width:200px;height:12px;border-radius:6px;background:var(--or);
  box-shadow:0 0 18px var(--or-glow);transform-origin:left;animation:growX .8s .8s var(--ease) both}
.hook{position:absolute;left:74px;top:238px;width:1776px;margin:0;font-size:34px;line-height:46px;white-space:nowrap;font-weight:500;color:var(--body);letter-spacing:-.02em;
  animation:fadeUp .8s 1s var(--ease) both}
.hook b{color:#fff}

/* glass card */
.glass{border-radius:32px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 45%,rgba(0,0,0,.4));
  border:2.5px solid var(--line);box-shadow:0 0 24px rgba(255,255,255,.18),inset 0 0 30px rgba(255,255,255,.05)}
.glass.o{border-color:var(--or);box-shadow:0 0 26px var(--or-glow),inset 0 0 30px rgba(246,130,31,.08)}
.glass.r{border-color:var(--red);box-shadow:0 0 26px var(--red-glow),inset 0 0 30px rgba(240,55,60,.08)}
.glass.dim{border-color:rgba(255,255,255,.28);box-shadow:none}
.ibox{flex:none;width:88px;height:88px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(150deg,#232327,#060607);border:2px solid rgba(255,255,255,.55);
  box-shadow:0 0 14px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.12)}
.ibox.o{border-color:var(--or);box-shadow:0 0 16px var(--or-glow)}
.ibox svg,.ico{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ibox.o svg{stroke:var(--or)}
svg *{transform-box:fill-box}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;font-size:22px;font-weight:800;letter-spacing:-.01em;
  background:#0b0b0c;border:2px solid rgba(255,255,255,.5)}
.chip.o{border-color:var(--or);color:var(--or-soft);background:var(--or-dim)}
.chip.r{border-color:var(--red);color:#ff9a9d;background:rgba(240,55,60,.1)}

/* interactive buttons */
.btn{font:700 26px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:14px;
  padding:16px 28px;border-radius:999px;background:#0b0b0c;border:2.5px solid rgba(255,255,255,.85);
  box-shadow:0 0 16px rgba(255,255,255,.22);transition:transform .2s var(--ease),box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 28px rgba(255,255,255,.4)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.o{border-color:var(--or);box-shadow:0 0 18px var(--or-glow)}
.btn.o:hover{box-shadow:0 0 34px var(--or)}
.btn.r{border-color:var(--red);box-shadow:0 0 18px var(--red-glow)}
.btn.on{background:var(--or);border-color:var(--or);color:#160800}
.btn svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tap-hint{font-size:22px;font-weight:600;color:var(--soft);display:inline-flex;align-items:center;gap:10px}
.tap-hint::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--or);box-shadow:0 0 10px var(--or);animation:blip 1.4s ease-in-out infinite}
@keyframes blip{50%{opacity:.3;transform:scale(.7)}}

/* toggle switch */
.sw{flex:none;position:relative;width:84px;height:46px;border-radius:23px;background:#2a2a2f;border:2px solid rgba(255,255,255,.35);transition:background .3s,border-color .3s,box-shadow .3s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:34px;height:34px;border-radius:50%;background:#cfcfd6;transition:transform .35s var(--pop),background .3s}
.on > .sw,.on .sw,.sw.on{background:var(--or);border-color:var(--or);box-shadow:0 0 16px var(--or-glow)}
.on > .sw::after,.on .sw::after,.sw.on::after{transform:translateX(38px);background:#fff}

/* PRO note: a small button top-right that opens the developer note */
.pro{position:absolute;right:72px;top:38px;z-index:30;animation:fadeIn .6s 1.4s both}
.pro > button{font:900 20px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;color:var(--or-soft);cursor:pointer;
  padding:12px 18px 12px 16px;border-radius:14px;background:#0b0b0c;border:2px solid rgba(246,130,31,.7);display:flex;align-items:center;gap:10px;
  transition:background .2s,color .2s,box-shadow .2s}
.pro > button::before{content:"</>";font:800 18px/1 'JetBrains Mono',monospace;letter-spacing:0}
.pro > button:hover{box-shadow:0 0 20px var(--or-glow)}
.pro.open > button{background:var(--or);color:#160800}
.pro .note{position:absolute;right:0;top:62px;width:760px;padding:28px 32px;border-radius:24px;background:rgba(10,10,12,.97);
  border:2px solid var(--or);box-shadow:0 0 40px rgba(246,130,31,.35),0 30px 60px rgba(0,0,0,.8);
  font-size:24px;line-height:34px;font-weight:500;color:var(--body);opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
.pro.open .note{opacity:1;transform:none;pointer-events:auto}
.pro .note small{display:block;font-size:17px;font-weight:900;letter-spacing:.14em;color:var(--or-soft);margin-bottom:10px}
.pro .note p{margin:0 0 10px}.pro .note p:last-child{margin:0}
.pro .note b{color:#fff}
.pro .note code{font-size:21px;color:var(--or-soft)}

/* keyframes */
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeRight{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes glowPulse{50%{filter:drop-shadow(0 0 26px var(--or))}}
.in{animation:fadeUp .7s var(--ease) both}
.in-card{animation:cardIn .9s var(--ease) both}
.in-pop{animation:pop .6s var(--pop) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
<style>
/* cover: the artwork fills the slide, with a slow push-in (same as the GitHub deck cover) */
.cover{position:absolute;inset:0;overflow:hidden;background:#000}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 48%;
  animation:coverIn 1.2s var(--ease) both, push 18s 1.2s ease-in-out infinite alternate}
@keyframes coverIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes push{to{transform:scale(1.05)}}
</style>
</head>

<script data-src="assets/base.js">
// Shared runtime for every slide: fit the 1920×1080 stage, talk to the deck, copy buttons.
(function(){
  var stage = document.getElementById('stage');
  function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
  addEventListener('resize', fit); fit();

  // clicks on buttons/links stay inside the slide; anywhere else advances the deck
  var INTERACTIVE = 'button,a,input,select,textarea,label,[data-tap]';
  var inDeck = window.top !== window;
  addEventListener('click', function(e){
    if(e.target.closest(INTERACTIVE)) return;
    if(inDeck) parent.postMessage({deck:'click'}, '*');
  });
  addEventListener('keydown', function(e){
    if(e.target.closest('input,textarea')) return;
    if(inDeck){ e.preventDefault(); parent.postMessage({deck:'key', key:e.key}, '*'); }
    else if(e.key==='r' || e.key==='R') location.reload();
  });

  // [data-copy] buttons copy the text of the element they point to
  document.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var src = document.querySelector(b.getAttribute('data-copy'));
      var text = src ? src.textContent.trim().replace(/^[“"]|[”"]$/g,'') : '';
      var done = function(){ var t=b.innerHTML; b.textContent='Copied ✓'; b.classList.add('on'); setTimeout(function(){ b.innerHTML=t; b.classList.remove('on'); },1400); };
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
      function fallback(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); }
    });
  });
})();
</script>
