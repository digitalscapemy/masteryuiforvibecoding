<!doctype html>
<html lang="en" data-slide="02">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style data-src="assets/base.css">
/* Shared look for the Cloudflare series slides (black, white glass, orange accents).
   Same frame as the GitHub Power Skills deck, recoloured: --or replaces the GitHub green. */
:root{
  --bg:#000;--text:#fff;--body:#E8E8EC;--soft:#B9B9C2;--line:rgba(255,255,255,.78);
  --or:#F6821F;--or-soft:#FFB25E;--or-glow:rgba(246,130,31,.55);--or-dim:rgba(246,130,31,.12);
  --red:#F0373C;--red-glow:rgba(240,55,60,.55);
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.3,1.5,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;
  background:radial-gradient(1000px 600px at 70% 58%,rgba(246,130,31,.06),transparent 70%),
             radial-gradient(900px 560px at 30% 40%,rgba(255,255,255,.035),transparent 70%),var(--bg)}
.abs{position:absolute}
code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* header: the slide number is added by slide-no.js */
.label{position:absolute;left:72px;top:40px;display:flex;align-items:center;gap:26px;font-size:30px;font-weight:700;letter-spacing:-.015em}
.label span{animation:fadeRight .7s .25s var(--ease) both}
.label .part{color:var(--or-soft);font-weight:800}
.title{position:absolute;left:72px;top:104px;margin:0;font-size:80px;line-height:96px;font-weight:800;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;padding-bottom:6px}
.title > span{display:inline-block;animation:rise .9s .35s var(--ease) both}
.title em{font-style:normal;color:var(--or)}
.bar{position:absolute;left:74px;top:208px;width:200px;height:12px;border-radius:6px;background:var(--or);
  box-shadow:0 0 18px var(--or-glow);transform-origin:left;animation:growX .8s .8s var(--ease) both}
.hook{position:absolute;left:74px;top:238px;width:1776px;margin:0;font-size:34px;line-height:46px;white-space:nowrap;font-weight:500;color:var(--body);letter-spacing:-.02em;
  animation:fadeUp .8s 1s var(--ease) both}
.hook b{color:#fff}

/* glass card */
.glass{border-radius:32px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 45%,rgba(0,0,0,.4));
  border:2.5px solid var(--line);box-shadow:0 0 24px rgba(255,255,255,.18),inset 0 0 30px rgba(255,255,255,.05)}
.glass.o{border-color:var(--or);box-shadow:0 0 26px var(--or-glow),inset 0 0 30px rgba(246,130,31,.08)}
.glass.r{border-color:var(--red);box-shadow:0 0 26px var(--red-glow),inset 0 0 30px rgba(240,55,60,.08)}
.glass.dim{border-color:rgba(255,255,255,.28);box-shadow:none}
.ibox{flex:none;width:88px;height:88px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(150deg,#232327,#060607);border:2px solid rgba(255,255,255,.55);
  box-shadow:0 0 14px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.12)}
.ibox.o{border-color:var(--or);box-shadow:0 0 16px var(--or-glow)}
.ibox svg,.ico{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ibox.o svg{stroke:var(--or)}
svg *{transform-box:fill-box}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;font-size:22px;font-weight:800;letter-spacing:-.01em;
  background:#0b0b0c;border:2px solid rgba(255,255,255,.5)}
.chip.o{border-color:var(--or);color:var(--or-soft);background:var(--or-dim)}
.chip.r{border-color:var(--red);color:#ff9a9d;background:rgba(240,55,60,.1)}

/* interactive buttons */
.btn{font:700 26px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:14px;
  padding:16px 28px;border-radius:999px;background:#0b0b0c;border:2.5px solid rgba(255,255,255,.85);
  box-shadow:0 0 16px rgba(255,255,255,.22);transition:transform .2s var(--ease),box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 28px rgba(255,255,255,.4)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.o{border-color:var(--or);box-shadow:0 0 18px var(--or-glow)}
.btn.o:hover{box-shadow:0 0 34px var(--or)}
.btn.r{border-color:var(--red);box-shadow:0 0 18px var(--red-glow)}
.btn.on{background:var(--or);border-color:var(--or);color:#160800}
.btn svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tap-hint{font-size:22px;font-weight:600;color:var(--soft);display:inline-flex;align-items:center;gap:10px}
.tap-hint::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--or);box-shadow:0 0 10px var(--or);animation:blip 1.4s ease-in-out infinite}
@keyframes blip{50%{opacity:.3;transform:scale(.7)}}

/* toggle switch */
.sw{flex:none;position:relative;width:84px;height:46px;border-radius:23px;background:#2a2a2f;border:2px solid rgba(255,255,255,.35);transition:background .3s,border-color .3s,box-shadow .3s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:34px;height:34px;border-radius:50%;background:#cfcfd6;transition:transform .35s var(--pop),background .3s}
.on > .sw,.on .sw,.sw.on{background:var(--or);border-color:var(--or);box-shadow:0 0 16px var(--or-glow)}
.on > .sw::after,.on .sw::after,.sw.on::after{transform:translateX(38px);background:#fff}

/* PRO note: a small button top-right that opens the developer note */
.pro{position:absolute;right:72px;top:38px;z-index:30;animation:fadeIn .6s 1.4s both}
.pro > button{font:900 20px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;color:var(--or-soft);cursor:pointer;
  padding:12px 18px 12px 16px;border-radius:14px;background:#0b0b0c;border:2px solid rgba(246,130,31,.7);display:flex;align-items:center;gap:10px;
  transition:background .2s,color .2s,box-shadow .2s}
.pro > button::before{content:"</>";font:800 18px/1 'JetBrains Mono',monospace;letter-spacing:0}
.pro > button:hover{box-shadow:0 0 20px var(--or-glow)}
.pro.open > button{background:var(--or);color:#160800}
.pro .note{position:absolute;right:0;top:62px;width:760px;padding:28px 32px;border-radius:24px;background:rgba(10,10,12,.97);
  border:2px solid var(--or);box-shadow:0 0 40px rgba(246,130,31,.35),0 30px 60px rgba(0,0,0,.8);
  font-size:24px;line-height:34px;font-weight:500;color:var(--body);opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
.pro.open .note{opacity:1;transform:none;pointer-events:auto}
.pro .note small{display:block;font-size:17px;font-weight:900;letter-spacing:.14em;color:var(--or-soft);margin-bottom:10px}
.pro .note p{margin:0 0 10px}.pro .note p:last-child{margin:0}
.pro .note b{color:#fff}
.pro .note code{font-size:21px;color:var(--or-soft)}

/* keyframes */
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeRight{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes glowPulse{50%{filter:drop-shadow(0 0 26px var(--or))}}
.in{animation:fadeUp .7s var(--ease) both}
.in-card{animation:cardIn .9s var(--ease) both}
.in-pop{animation:pop .6s var(--pop) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
<style>
/* LAYOUT: a road map. One orange road with 4 stations + a finish flag; each station drops a card of lessons you can tap to jump */
.road{position:absolute;left:110px;top:352px;width:1700px;height:10px;border-radius:5px;background:var(--or);box-shadow:0 0 18px var(--or-glow);transform-origin:left;animation:growX 1.3s 1s cubic-bezier(.6,0,.3,1) both}
.runner{position:absolute;left:100px;top:345px;width:24px;height:24px;border-radius:50%;background:#fff6ec;box-shadow:0 0 18px 8px var(--or-glow);opacity:0;animation:run 7s 2.6s linear infinite}
@keyframes run{0%{transform:none;opacity:0}4%{opacity:1}90%{opacity:1;transform:translateX(1700px)}100%{opacity:0;transform:translateX(1700px)}}
.stn{position:absolute;top:322px;width:70px;height:70px;margin-left:-35px;border-radius:50%;display:grid;place-items:center;background:#0b0b0c;border:4px solid var(--or);
  font:900 32px Inter,sans-serif;color:var(--or);box-shadow:0 0 18px var(--or-glow);animation:pop .6s var(--pop) both}
.s1{left:240px;animation-delay:1.4s}.s2{left:680px;animation-delay:1.6s}.s3{left:1120px;animation-delay:1.8s}.s4{left:1560px;animation-delay:2s}
.flag{position:absolute;left:1790px;top:280px;animation:pop .6s 2.2s var(--pop) both}
.flag svg{width:60px;height:80px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.flag svg .f{fill:var(--or);stroke:none}

.card{position:absolute;top:420px;width:410px;min-height:450px;padding:24px 22px 20px;animation:cardIn .8s var(--ease) both}
.card::before{content:"";position:absolute;left:50%;top:-30px;width:3px;height:30px;margin-left:-1.5px;background:linear-gradient(var(--or),rgba(246,130,31,.2))}
.c1{left:35px;animation-delay:1.5s}.c2{left:475px;animation-delay:1.7s}.c3{left:915px;animation-delay:1.9s}.c4{left:1355px;animation-delay:2.1s}
.card small{font-size:17px;font-weight:900;letter-spacing:.12em;color:var(--or-soft)}
.card h2{margin:4px 0 6px;font-size:36px;line-height:42px;font-weight:900;letter-spacing:-.025em}
.card p{margin:0 0 14px;font-size:21px;line-height:28px;font-weight:500;color:var(--soft)}
.l{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:2px solid transparent;
  color:#fff;font:700 22px/1.2 Inter,sans-serif;letter-spacing:-.015em;text-align:left;cursor:pointer;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.l:hover{background:var(--or-dim);border-color:var(--or);transform:translateX(5px)}
.l .no{flex:none;min-width:52px;padding:4px 6px;border-radius:8px;text-align:center;font:900 16px 'JetBrains Mono',monospace;background:#1b1c20;border:1.5px solid rgba(255,255,255,.4)}
.l.sub{padding-left:24px;font-size:20px;font-weight:600;color:var(--body);background:none}
.l.sub .no{min-width:46px;font-size:14px;background:none;color:var(--soft)}
.l .go{margin-left:auto;font-size:18px;color:var(--or-soft);opacity:0;transition:opacity .2s}
.l:hover .go{opacity:1}

.start{position:absolute;left:74px;top:946px;display:flex;align-items:center;gap:18px;animation:fadeUp .8s 2.4s var(--ease) both}
.start .l{width:auto;margin:0;padding:14px 20px;font-size:23px}
.start .l.fin{background:var(--or-dim);border-color:var(--or);box-shadow:0 0 18px var(--or-glow)}
.start .arrow{font-size:28px;color:var(--soft)}
.start .tap-hint{margin-left:30px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="label"><span>Cloudflare Gatekeeper for Vibe Coders · <b class="part">Start here</b></span></div>
  <h1 class="title"><span>Class <em>agenda</em></span></h1>

    <button class="l sub" data-go="06c"><span class="no">06C</span>Lock the back door<span class="go">↗</span></button>
    <button class="l sub" data-go="06d"><span class="no">06D</span>Secure your account<span class="go">↗</span></button></div>

    <button class="l" data-go="07"><span class="no">07</span>R2: no exit toll<span class="go">↗</span></button>

    <button class="l sub" data-go="07b"><span class="no">07B</span>Backups every night<span class="go">↗</span></button></div>

  <div class="start">
    <button class="l" data-go="02a"><span class="no">02A</span>First: Cloudflare stands in front<span class="go">↗</span></button>
    <span class="arrow">→ … →</span>
    <button class="l" data-go="08"><span class="no">08</span>The real setup<span class="go">↗</span></button>
    <button class="l fin" data-go="09"><span class="no">09</span>Your Cloudflare checklist<span class="go">↗</span></button>
  </div>
</div>
<script data-src="assets/cf.js">
// Shared helpers for the Cloudflare slides:
//  - injects the SVG symbols used everywhere (#cf cloud, #shop house, #bot, #user)
//  - opens / closes the PRO note (top-right)
//  - [data-go] buttons jump to another slide in the deck
(function(){
  var sprite = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">'+
    '<symbol id="cf" viewBox="0 0 64 40"><path d="M50.5 38H12.5C6.2 38 1 32.9 1 26.6c0-5.6 4-10.3 9.4-11.2C12 8.2 18.4 3 26 3c6.6 0 12.3 3.9 14.8 9.6 1.4-.6 2.9-.9 4.5-.9 6.1 0 11.1 4.6 11.7 10.6 3.9 1.2 6.9 4.9 6.9 9.2C63.9 36.3 58.4 38 50.5 38z"/></symbol>'+
    '<symbol id="shop" viewBox="0 0 64 64"><path d="M8 28v30h48V28" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/><path d="M4 28 10 8h44l6 20z" fill="currentColor" opacity=".9"/><path d="M4 28c0 4 3.5 7 7 7s7-3 7-7c0 4 3.5 7 7 7s7-3 7-7c0 4 3.5 7 7 7s7-3 7-7c0 4 3.5 7 7 7s7-3 7-7" fill="none" stroke="#000" stroke-width="2.4"/><rect x="26" y="40" width="12" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="3.4"/><circle cx="32" cy="18" r="5" fill="#000"/></symbol>'+
    '<symbol id="bot" viewBox="0 0 48 48"><rect x="8" y="14" width="32" height="26" rx="8" fill="none" stroke="currentColor" stroke-width="3.4"/><circle cx="18" cy="27" r="3.6" fill="currentColor"/><circle cx="30" cy="27" r="3.6" fill="currentColor"/><path d="M24 14V6M18 34h12M4 24v8M44 24v8" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><circle cx="24" cy="5" r="3" fill="currentColor"/></symbol>'+
    '<symbol id="user" viewBox="0 0 48 48"><circle cx="24" cy="15" r="9" fill="none" stroke="currentColor" stroke-width="3.4"/><path d="M7 44c1.5-9 8.5-14 17-14s15.5 5 17 14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>'+
    '<symbol id="lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>'+
    '<symbol id="server" viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="3.2"/><rect x="6" y="26" width="36" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="3.2"/><circle cx="14" cy="13" r="2.4" fill="currentColor"/><circle cx="14" cy="33" r="2.4" fill="currentColor"/><path d="M24 13h12M24 33h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>'+
    '</svg>';
  document.body.insertAdjacentHTML('afterbegin', sprite);

  document.querySelectorAll('.pro > button').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation(); b.parentElement.classList.toggle('open'); });
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.pro')) document.querySelectorAll('.pro.open').forEach(function(p){ p.classList.remove('open'); });
  }, true);

  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){
      if(window.top!==window) parent.postMessage({deck:'goto', slide:b.dataset.go}, '*');
      else location.href = 'cf-slide-'+b.dataset.go+'.html';

})();

<script data-src="assets/base.js">
// Shared runtime for every slide: fit the 1920×1080 stage, talk to the deck, copy buttons.
(function(){
  var stage = document.getElementById('stage');
  function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
  addEventListener('resize', fit); fit();

  // clicks on buttons/links stay inside the slide; anywhere else advances the deck
  var INTERACTIVE = 'button,a,input,select,textarea,label,[data-tap]';
  var inDeck = window.top !== window;
  addEventListener('click', function(e){
    if(e.target.closest(INTERACTIVE)) return;
    if(inDeck) parent.postMessage({deck:'click'}, '*');
  });
  addEventListener('keydown', function(e){
    if(e.target.closest('input,textarea')) return;
    if(inDeck){ e.preventDefault(); parent.postMessage({deck:'key', key:e.key}, '*'); }
    else if(e.key==='r' || e.key==='R') location.reload();
  });

  // [data-copy] buttons copy the text of the element they point to
  document.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var src = document.querySelector(b.getAttribute('data-copy'));
      var text = src ? src.textContent.trim().replace(/^[“"]|[”"]$/g,'') : '';
      var done = function(){ var t=b.innerHTML; b.textContent='Copied ✓'; b.classList.add('on'); setTimeout(function(){ b.innerHTML=t; b.classList.remove('on'); },1400); };
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
      function fallback(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); }
    });
  });
})();
</script>
<script data-src="assets/slide-no.js">
// Slide number in the header, Super Stack style: [04] Cloudflare Gatekeeper for Vibe Coders ────
// Shared by every cf-slide-XX.html. The number comes from the file name, so a new
// slide only needs a script tag pointing at assets/slide-no.js and a .label header.
(function(){
  var m = location.pathname.match(/slide-(\d+)([a-z]?)\.html$/i) || (document.documentElement.getAttribute('data-slide')||'').match(/^(\d+)([a-z]?)$/i);
  if(!m) return;
  var no = String(parseInt(m[1],10)).padStart(2,'0') + (m[2]||'').toUpperCase();
  var stage = document.getElementById('stage');
  if(!stage) return;

  var old = stage.querySelector('.page');
  if(old) old.remove();

  var css = document.createElement('style');
  css.textContent =
    '.label.numbered{gap:22px}'+
    '.label.numbered::before{display:none}'+
    '.slide-no{flex:none;height:50px;min-width:72px;padding:0 14px;display:flex;align-items:center;justify-content:center;border-radius:12px;'+
      'font:800 30px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;'+
      'background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.6));border:2px solid rgba(255,255,255,.85);'+
      'box-shadow:0 0 18px rgba(255,255,255,.3),inset 0 0 12px rgba(255,255,255,.1);'+
      'animation:slideNoIn .7s .1s cubic-bezier(.3,1.5,.5,1) both}'+
    '.slide-line{position:relative;flex:none;width:520px;height:2px;margin-left:8px;'+
      'background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,.25) 60%,transparent);'+
      'transform-origin:left;animation:slideLineIn 1s .5s cubic-bezier(.2,.8,.2,1) both}'+
    '.slide-line::before{content:"";position:absolute;left:0;top:-3px;width:150px;height:8px;border-radius:8px;'+
      'background:linear-gradient(90deg,#F6821F,rgba(246,130,31,.35));box-shadow:0 0 14px rgba(246,130,31,.7)}'+
    '@keyframes slideNoIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}'+
    '@keyframes slideLineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}'+
    '@media (prefers-reduced-motion:reduce){.slide-no,.slide-line{animation:none}}';
  document.head.appendChild(css);

  var label = stage.querySelector('.label');
  var b = document.createElement('div');
  b.className = 'slide-no';
  b.textContent = no;
  if(label){
    label.classList.add('numbered');
    label.prepend(b);
    var line = document.createElement('i');
    line.className = 'slide-line';
    label.appendChild(line);
  }else{
    b.style.cssText = 'position:absolute;right:62px;top:22px;z-index:20';
    stage.appendChild(b);
  }
})();
</script>
