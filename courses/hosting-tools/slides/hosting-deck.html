<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosting Tools Deck</title>
<style>
:root{--bg:#000;--dot:rgba(255,255,255,.28);--dot-on:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Inter,system-ui,sans-serif}
.slide{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;
  transform:translateX(40px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.slide.prev{transform:translateX(-40px)}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.ui{position:fixed;left:0;right:0;bottom:14px;z-index:10;display:flex;justify-content:center;gap:10px;
  opacity:0;transition:opacity .3s}
body:hover .ui,.ui.show{opacity:1}
.ui button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--dot);cursor:pointer}
.ui button.on{background:var(--dot-on);width:28px;border-radius:5px}
.count{position:fixed;right:16px;bottom:10px;z-index:10;font-size:12px;color:#666;opacity:0;transition:opacity .3s}
body:hover .count{opacity:1}
</style>
</head>
<body>
<nav class="ui" id="ui"></nav>
<div class="count" id="count"></div>

<script>
// Order of the deck. Add new slides here.
const SLIDES = ['hosting-slide-00.html','hosting-slide-00a.html','hosting-slide-01.html','hosting-slide-01a.html','hosting-slide-01b.html','hosting-slide-01c.html','hosting-slide-02.html','hosting-slide-02a.html','hosting-slide-02b.html','hosting-slide-02c.html','hosting-slide-03.html','hosting-slide-03a.html','hosting-slide-03b.html','hosting-slide-03c.html','hosting-slide-04.html','hosting-slide-04a.html','hosting-slide-04b.html','hosting-slide-04c.html','hosting-slide-05.html','hosting-slide-05a.html','hosting-slide-05b.html','hosting-slide-05c.html','hosting-slide-06.html','hosting-slide-06a.html','hosting-slide-06b.html','hosting-slide-06c.html','hosting-slide-07.html','hosting-slide-07a.html','hosting-slide-07b.html','hosting-slide-07c.html','hosting-slide-08.html','hosting-slide-08a.html'];

// the number printed on each slide: 00, 01, 02, 02A ... (taken from the file name)
const NUM = SLIDES.map(src=>src.replace(/^hosting-slide-|\.html$/g,'').toUpperCase());
const frames = SLIDES.map((src,i)=>{
  const f = document.createElement('iframe');
  f.className = 'slide'; f.title = 'Slide '+NUM[i]; f.dataset.src = src;
  document.body.prepend(f);
  return f;
});
const ui = document.getElementById('ui'), count = document.getElementById('count');
const dots = SLIDES.map((_,i)=>{
  const b = document.createElement('button'); b.setAttribute('aria-label','Go to slide '+NUM[i]); b.title='Slide '+NUM[i];
  b.onclick = e=>{ e.stopPropagation(); go(i); }; ui.append(b); return b;
});

let cur = -1;
function go(i){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  if(i===cur) return;
  const back = i < cur;
  frames.forEach((f,k)=>{
    f.classList.toggle('prev', back ? k>i : k<i);
    f.classList.remove('on');
  });
  // fresh load = the slide's entrance animation plays from the start
  const f = frames[i];
  f.src = f.dataset.src;
  f.onload = ()=>{ if(frames[cur]===f){ f.classList.add('on'); try{ f.contentWindow.focus(); }catch(_){} } };
  // free the slide we left once it has faded out
  const old = frames[cur];
  if(old) setTimeout(()=>{ if(!old.classList.contains('on')) old.removeAttribute('src'); }, 700);
  cur = i;
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  count.textContent = 'Slide '+NUM[i];
  history.replaceState(null,'','#'+(i+1));
}
const next = ()=>go(cur+1), prev = ()=>go(cur-1);

function onKey(key){
  if(['ArrowRight','ArrowDown','PageDown',' ','Spacebar','Enter'].includes(key)) next();
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(key)) prev();
  else if(key==='Home') go(0);
  else if(key==='End') go(SLIDES.length-1);
  else if(key==='r'||key==='R'){ const f=frames[cur]; f.src=f.dataset.src; }
  else if(key==='f'||key==='F'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
  else if(/^[1-9]$/.test(key)) go(+key-1);
}
addEventListener('keydown', e=>{ e.preventDefault(); onKey(e.key); });
// keys/clicks that land inside a slide are forwarded here
addEventListener('message', e=>{
  if(e.data && e.data.deck==='key') onKey(e.data.key);
  if(e.data && e.data.deck==='click') next();
  if(e.data && e.data.deck==='goto'){ const i=SLIDES.indexOf('hosting-slide-'+e.data.slide+'.html'); if(i>=0) go(i); }
});

go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
