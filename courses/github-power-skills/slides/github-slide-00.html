<!doctype html>
<html lang="en" data-slide="00">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Power Skills</title>
<style data-src="assets/base.css">
/* Shared look for the GitHub series slides (black, white glass, green accents). */
:root{
  --bg:#000;--text:#fff;--body:#E8E8EC;--soft:#B9B9C2;--line:rgba(255,255,255,.78);
  --green:#4BF03C;--green-soft:#9BF56B;--green-glow:rgba(75,240,60,.55);
  --red:#F0373C;--red-glow:rgba(240,55,60,.55);
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.3,1.5,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;
  background:radial-gradient(900px 560px at 66% 54%,rgba(255,255,255,.05),transparent 70%),var(--bg)}
.abs{position:absolute}

/* header: the slide number is added by slide-no.js */
.label{position:absolute;left:72px;top:40px;display:flex;align-items:center;gap:26px;font-size:30px;font-weight:700;letter-spacing:-.015em}
.label span{animation:fadeRight .7s .25s var(--ease) both}
.title{position:absolute;left:72px;top:104px;margin:0;font-size:84px;line-height:100px;font-weight:800;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;padding-bottom:6px}
.title > span{display:inline-block;animation:rise .9s .35s var(--ease) both}
.title em{font-style:normal;color:var(--green-soft)}
.bar{position:absolute;left:74px;top:212px;width:200px;height:12px;border-radius:6px;background:#fff;
  box-shadow:0 0 18px rgba(255,255,255,.45);transform-origin:left;animation:growX .8s .8s var(--ease) both}
.hook{position:absolute;left:74px;top:236px;margin:0;font-size:38px;line-height:50px;font-weight:500;color:var(--body);letter-spacing:-.02em;
  animation:fadeUp .8s 1s var(--ease) both}
.hook b{color:#fff}

/* glass card */
.glass{border-radius:36px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 45%,rgba(0,0,0,.4));
  border:2.5px solid var(--line);box-shadow:0 0 24px rgba(255,255,255,.22),inset 0 0 30px rgba(255,255,255,.06)}
.glass.g{border-color:var(--green);box-shadow:0 0 26px var(--green-glow),inset 0 0 30px rgba(75,240,60,.08)}
.glass.r{border-color:var(--red);box-shadow:0 0 26px var(--red-glow),inset 0 0 30px rgba(240,55,60,.08)}
.ibox{flex:none;width:96px;height:96px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(150deg,#232327,#060607);border:2px solid rgba(255,255,255,.55);
  box-shadow:0 0 14px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.12)}
.ibox svg,.ico{width:50px;height:50px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg *{transform-box:fill-box}

/* interactive buttons */
.btn{font:700 28px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:14px;
  padding:18px 30px;border-radius:999px;background:#0b0b0c;border:2.5px solid rgba(255,255,255,.85);
  box-shadow:0 0 16px rgba(255,255,255,.25);transition:transform .2s var(--ease),box-shadow .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 28px rgba(255,255,255,.45)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.g{border-color:var(--green);box-shadow:0 0 18px var(--green-glow)}
.btn.g:hover{box-shadow:0 0 34px var(--green)}
.btn.r{border-color:var(--red);box-shadow:0 0 18px var(--red-glow)}
.btn.on{background:#fff;color:#000}
.btn svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tap-hint{font-size:22px;font-weight:600;color:var(--soft);display:inline-flex;align-items:center;gap:10px}
.tap-hint::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blip 1.4s ease-in-out infinite}
@keyframes blip{50%{opacity:.3;transform:scale(.7)}}

/* "Ask your AI" prompt card with a copy button */
.ask{display:flex;align-items:center;gap:26px;padding:22px 26px 22px 28px;border-radius:28px;
  background:linear-gradient(90deg,rgba(75,240,60,.08),rgba(255,255,255,.02));border:2.5px solid rgba(155,245,107,.75);box-shadow:0 0 20px rgba(75,240,60,.25)}
.ask .term{flex:none;width:78px;height:60px;border-radius:12px;border:3.5px solid var(--green);display:grid;place-items:center;box-shadow:0 0 12px var(--green-glow)}
.ask .term svg{width:46px;height:30px;stroke:var(--green);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ask .term .cur{animation:caret 1s steps(1) infinite}
.ask .q{flex:1}
.ask .q small{display:block;font-size:20px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green-soft);margin-bottom:6px}
.ask .q p{margin:0;font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.02em}
.ask .copy{font-size:22px;padding:14px 22px}
@keyframes caret{50%{opacity:0}}

/* closing line used on a few slides only */
.remember{display:flex;align-items:center;gap:22px;font-size:40px;font-weight:500;letter-spacing:-.02em}
.remember b{font-weight:800}
.remember svg{width:60px;height:60px;fill:#fff;filter:drop-shadow(0 0 10px rgba(255,255,255,.4))}

/* keyframes */
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeRight{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.in{animation:fadeUp .7s var(--ease) both}
.in-card{animation:cardIn .9s var(--ease) both}
.in-pop{animation:pop .6s var(--pop) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
<style>
/* cover: the artwork fills the slide, with a slow push-in */
.cover{position:absolute;inset:0;overflow:hidden;background:#000}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:44% 46%;
  animation:coverIn 1.2s var(--ease) both, push 18s 1.2s ease-in-out infinite alternate}
@keyframes coverIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes push{to{transform:scale(1.05)}}
</style>
</head>

<script data-src="assets/base.js">
// Shared runtime for every slide: fit the 1920×1080 stage, talk to the deck, copy buttons.
(function(){
  var stage = document.getElementById('stage');
  function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
  addEventListener('resize', fit); fit();

  // clicks on buttons/links stay inside the slide; anywhere else advances the deck
  var INTERACTIVE = 'button,a,input,select,textarea,label,[data-tap]';
  var inDeck = window.top !== window;
  addEventListener('click', function(e){
    if(e.target.closest(INTERACTIVE)) return;
    if(inDeck) parent.postMessage({deck:'click'}, '*');
  });
  addEventListener('keydown', function(e){
    if(e.target.closest('input,textarea')) return;
    if(inDeck){ e.preventDefault(); parent.postMessage({deck:'key', key:e.key}, '*'); }
    else if(e.key==='r' || e.key==='R') location.reload();
  });

  // [data-copy] buttons copy the text of the element they point to
  document.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var src = document.querySelector(b.getAttribute('data-copy'));
      var text = src ? src.textContent.trim().replace(/^[“"]|[”"]$/g,'') : '';
      var done = function(){ var t=b.innerHTML; b.textContent='Copied ✓'; b.classList.add('on'); setTimeout(function(){ b.innerHTML=t; b.classList.remove('on'); },1400); };
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
      function fallback(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); }
    });
  });
})();
</script>
