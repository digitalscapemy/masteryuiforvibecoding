<!doctype html>
<html lang="en" data-slide="11">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summary: Your GitHub Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style data-src="assets/base.css">
/* Shared look for the GitHub series slides (black, white glass, green accents). */
:root{
  --bg:#000;--text:#fff;--body:#E8E8EC;--soft:#B9B9C2;--line:rgba(255,255,255,.78);
  --green:#4BF03C;--green-soft:#9BF56B;--green-glow:rgba(75,240,60,.55);
  --red:#F0373C;--red-glow:rgba(240,55,60,.55);
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.3,1.5,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;
  background:radial-gradient(900px 560px at 66% 54%,rgba(255,255,255,.05),transparent 70%),var(--bg)}
.abs{position:absolute}

/* header: the slide number is added by slide-no.js */
.label{position:absolute;left:72px;top:40px;display:flex;align-items:center;gap:26px;font-size:30px;font-weight:700;letter-spacing:-.015em}
.label span{animation:fadeRight .7s .25s var(--ease) both}
.title{position:absolute;left:72px;top:104px;margin:0;font-size:84px;line-height:100px;font-weight:800;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;padding-bottom:6px}
.title > span{display:inline-block;animation:rise .9s .35s var(--ease) both}
.title em{font-style:normal;color:var(--green-soft)}
.bar{position:absolute;left:74px;top:212px;width:200px;height:12px;border-radius:6px;background:#fff;
  box-shadow:0 0 18px rgba(255,255,255,.45);transform-origin:left;animation:growX .8s .8s var(--ease) both}
.hook{position:absolute;left:74px;top:236px;margin:0;font-size:38px;line-height:50px;font-weight:500;color:var(--body);letter-spacing:-.02em;
  animation:fadeUp .8s 1s var(--ease) both}
.hook b{color:#fff}

/* glass card */
.glass{border-radius:36px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 45%,rgba(0,0,0,.4));
  border:2.5px solid var(--line);box-shadow:0 0 24px rgba(255,255,255,.22),inset 0 0 30px rgba(255,255,255,.06)}
.glass.g{border-color:var(--green);box-shadow:0 0 26px var(--green-glow),inset 0 0 30px rgba(75,240,60,.08)}
.glass.r{border-color:var(--red);box-shadow:0 0 26px var(--red-glow),inset 0 0 30px rgba(240,55,60,.08)}
.ibox{flex:none;width:96px;height:96px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(150deg,#232327,#060607);border:2px solid rgba(255,255,255,.55);
  box-shadow:0 0 14px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.12)}
.ibox svg,.ico{width:50px;height:50px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg *{transform-box:fill-box}

/* interactive buttons */
.btn{font:700 28px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:14px;
  padding:18px 30px;border-radius:999px;background:#0b0b0c;border:2.5px solid rgba(255,255,255,.85);
  box-shadow:0 0 16px rgba(255,255,255,.25);transition:transform .2s var(--ease),box-shadow .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 28px rgba(255,255,255,.45)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.g{border-color:var(--green);box-shadow:0 0 18px var(--green-glow)}
.btn.g:hover{box-shadow:0 0 34px var(--green)}
.btn.r{border-color:var(--red);box-shadow:0 0 18px var(--red-glow)}
.btn.on{background:#fff;color:#000}
.btn svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tap-hint{font-size:22px;font-weight:600;color:var(--soft);display:inline-flex;align-items:center;gap:10px}
.tap-hint::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blip 1.4s ease-in-out infinite}
@keyframes blip{50%{opacity:.3;transform:scale(.7)}}

/* "Ask your AI" prompt card with a copy button */
.ask{display:flex;align-items:center;gap:26px;padding:22px 26px 22px 28px;border-radius:28px;
  background:linear-gradient(90deg,rgba(75,240,60,.08),rgba(255,255,255,.02));border:2.5px solid rgba(155,245,107,.75);box-shadow:0 0 20px rgba(75,240,60,.25)}
.ask .term{flex:none;width:78px;height:60px;border-radius:12px;border:3.5px solid var(--green);display:grid;place-items:center;box-shadow:0 0 12px var(--green-glow)}
.ask .term svg{width:46px;height:30px;stroke:var(--green);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ask .term .cur{animation:caret 1s steps(1) infinite}
.ask .q{flex:1}
.ask .q small{display:block;font-size:20px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green-soft);margin-bottom:6px}
.ask .q p{margin:0;font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.02em}
.ask .copy{font-size:22px;padding:14px 22px}
@keyframes caret{50%{opacity:0}}

/* closing line used on a few slides only */
.remember{display:flex;align-items:center;gap:22px;font-size:40px;font-weight:500;letter-spacing:-.02em}
.remember b{font-weight:800}
.remember svg{width:60px;height:60px;fill:#fff;filter:drop-shadow(0 0 10px rgba(255,255,255,.4))}

/* keyframes */
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeRight{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.in{animation:fadeUp .7s var(--ease) both}
.in-card{animation:cardIn .9s var(--ease) both}
.in-pop{animation:pop .6s var(--pop) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
<style>
/* twelve tools, grouped by the part of the course they belong to */
.grid{position:absolute;left:74px;top:318px;width:1776px;display:grid;grid-template-columns:repeat(5,1fr);gap:22px 18px}
.grp{grid-column:1/-1;display:flex;align-items:center;gap:16px;margin:6px 0 -4px;font-size:20px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
  animation:fadeIn .6s both}
.grp::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.3),transparent)}
.grp i{font-style:normal;color:var(--green-soft)}
.t{position:relative;display:flex;align-items:center;gap:16px;padding:22px 16px;text-align:left;cursor:pointer;font-family:inherit;color:#fff;
  border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(0,0,0,.35));border:2px solid rgba(255,255,255,.4);
  transition:border-color .2s,box-shadow .2s,transform .2s var(--ease);animation:cardIn .7s var(--ease) both}
.t:hover{border-color:var(--green);box-shadow:0 0 20px var(--green-glow);transform:translateY(-4px)}
.t .ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(150deg,#232327,#060607);border:2px solid rgba(255,255,255,.5)}
.t .ic svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.t:hover .ic svg{stroke:var(--green)}
.t b{display:block;font-size:25px;font-weight:800;letter-spacing:-.02em}
.t span{display:block;font-size:18px;line-height:23px;color:var(--soft);font-weight:500;margin-top:3px}
.t .no{position:absolute;right:16px;top:-13px;font-size:15px;font-weight:900;padding:4px 9px;border-radius:8px;background:#000;border:1.5px solid rgba(255,255,255,.5);color:#fff}
.t:hover .no{border-color:var(--green);color:var(--green-soft)}

.end{position:absolute;left:74px;top:910px;width:1776px;display:flex;align-items:center;gap:26px;animation:fadeUp .8s 2.4s var(--ease) both}
.end .remember{margin:0;font-size:34px}
.end .remember b{color:var(--green-soft)}
.end .btn{margin-left:auto}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="label"><span>GitHub Power Skills for Vibe Coders</span></div>
  <h1 class="title"><span>Summary: your GitHub <em>toolkit</em></span></h1>
  <div class="bar"></div>
  <p class="hook">Twelve tools. Each one does one job. Tap any tool to go back to its lesson.</p>

  <div class="grid" id="grid"></div>

  <div class="end">
    <p class="remember"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7L12 17.3 5.7 21.2l1.7-7L2 9.5l7.1-.6z"/></svg><span><b>Save</b> often. <b>Branch</b> for risk. Let <b>robots</b> check and ship.</span></p>
    <button class="btn g" data-go="11a">See the case studies<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>

<script>
const I = {
  repo:'<path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-8l-2-3H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1z"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  dot:'<circle cx="12" cy="12" r="4"/><path d="M12 2v6M12 16v6"/>',
  sync:'<path d="M7 17l-4-4 4-4M3 13h13a5 5 0 0 0 0-10h-1M17 7l4 4-4 4M21 11H8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  trunk:'<path d="M12 21V3M12 8l-5-4M12 13l5-4"/>',
  branch:'<circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 7.5v9M18 10.5c0 4-5 4-11 6"/>',
  desks:'<rect x="2" y="4" width="9" height="7" rx="1.5"/><rect x="13" y="4" width="9" height="7" rx="1.5"/><path d="M4 15h16M6 15v5M18 15v5"/>',
  robot:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M2 13v2M22 13v2"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
  rocket:'<path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2M14 4c3-1 6-1 6-1s0 3-1 6l-7 7-5-5z"/><circle cx="15" cy="9" r="1.5"/>'
};
const TOOLS = [
  ['Save and send'],
  ['03','repo','Repo','your project, safe in the cloud'],
  ['03B','lock','Keep secrets out','.env stays on your laptop'],
  ['03C','doc','README','the front page of your project'],
  ['04','dot','Commit','a save point you can go back to'],
  ['05','sync','Clone, Push, Pull','laptop and GitHub in sync'],
  ['Branching'],
  ['06','clock','Commit history','every change, line by line'],
  ['06A','trunk','Main','the version that always works'],
  ['07','branch','Branch','try new ideas safely'],
  ['07B','desks','Worktree','one desk per AI agent'],
  ['Automation'],
  ['08','robot','CI & CD','robots check and ship'],
  ['09','bell','Webhook','GitHub rings your server'],
  ['10','rocket','Laptop to live','push, and the site updates']
];
const grid = document.getElementById('grid');
let d = 1.1, part = 1;
TOOLS.forEach(t=>{
  if(t.length===1){
    part++;
    grid.insertAdjacentHTML('beforeend',`<div class="grp" style="animation-delay:${d}s"><i>Part ${part}</i> ${t[0]}</div>`);
    d += .08; return;
  }
  grid.insertAdjacentHTML('beforeend',`<button class="t" data-go="${t[0].toLowerCase()}" style="animation-delay:${d.toFixed(2)}s">
    <span class="ic"><svg viewBox="0 0 24 24">${I[t[1]]}</svg></span><div><b>${t[2]}</b><span>${t[3]}</span></div><span class="no">${t[0]}</span></button>`);
  d += .07;
});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
  if(window.top!==window) parent.postMessage({deck:'goto',slide:b.dataset.go},'*');
  else location.href='github-slide-'+b.dataset.go+'.html';
}));
</script>
<script data-src="assets/base.js">
// Shared runtime for every slide: fit the 1920×1080 stage, talk to the deck, copy buttons.
(function(){
  var stage = document.getElementById('stage');
  function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
  addEventListener('resize', fit); fit();

  // clicks on buttons/links stay inside the slide; anywhere else advances the deck
  var INTERACTIVE = 'button,a,input,select,textarea,label,[data-tap]';
  var inDeck = window.top !== window;
  addEventListener('click', function(e){
    if(e.target.closest(INTERACTIVE)) return;
    if(inDeck) parent.postMessage({deck:'click'}, '*');
  });
  addEventListener('keydown', function(e){
    if(e.target.closest('input,textarea')) return;
    if(inDeck){ e.preventDefault(); parent.postMessage({deck:'key', key:e.key}, '*'); }
    else if(e.key==='r' || e.key==='R') location.reload();
  });

  // [data-copy] buttons copy the text of the element they point to
  document.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var src = document.querySelector(b.getAttribute('data-copy'));
      var text = src ? src.textContent.trim().replace(/^[“"]|[”"]$/g,'') : '';
      var done = function(){ var t=b.innerHTML; b.textContent='Copied ✓'; b.classList.add('on'); setTimeout(function(){ b.innerHTML=t; b.classList.remove('on'); },1400); };
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
      function fallback(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); }
    });
  });
})();
</script>
<script data-src="assets/slide-no.js">
// Slide number in the header, Super Stack style: [04] GitHub Power Skills for Vibe Coders ────
// Shared by every github-slide-XX.html. The number comes from the file name, so a new
// slide only needs a script tag pointing at assets/slide-no.js and a .label header.
(function(){
  var m = location.pathname.match(/slide-(\d+)([a-z]?)\.html$/i) || (document.documentElement.getAttribute('data-slide')||'').match(/^(\d+)([a-z]?)$/i);
  if(!m) return;
  var no = String(parseInt(m[1],10)).padStart(2,'0') + (m[2]||'').toUpperCase();
  var stage = document.getElementById('stage');
  if(!stage) return;

  var old = stage.querySelector('.page');
  if(old) old.remove();

  var css = document.createElement('style');
  css.textContent =
    '.label.numbered{gap:22px}'+
    '.label.numbered::before{display:none}'+
    '.slide-no{flex:none;height:50px;min-width:72px;padding:0 14px;display:flex;align-items:center;justify-content:center;border-radius:12px;'+
      'font:800 30px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;'+
      'background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.6));border:2px solid rgba(255,255,255,.85);'+
      'box-shadow:0 0 18px rgba(255,255,255,.3),inset 0 0 12px rgba(255,255,255,.1);'+
      'animation:slideNoIn .7s .1s cubic-bezier(.3,1.5,.5,1) both}'+
    '.slide-line{position:relative;flex:none;width:520px;height:2px;margin-left:8px;'+
      'background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,.25) 60%,transparent);'+
      'transform-origin:left;animation:slideLineIn 1s .5s cubic-bezier(.2,.8,.2,1) both}'+
    '.slide-line::before{content:"";position:absolute;left:0;top:-3px;width:150px;height:8px;border-radius:8px;'+
      'background:linear-gradient(90deg,#fff,rgba(255,255,255,.4));box-shadow:0 0 14px rgba(255,255,255,.6)}'+
    '@keyframes slideNoIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}'+
    '@keyframes slideLineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}'+
    '@media (prefers-reduced-motion:reduce){.slide-no,.slide-line{animation:none}}';
  document.head.appendChild(css);

  var label = stage.querySelector('.label');
  var b = document.createElement('div');
  b.className = 'slide-no';
  b.textContent = no;
  if(label){
    label.classList.add('numbered');
    label.prepend(b);
    var line = document.createElement('i');
    line.className = 'slide-line';
    label.appendChild(line);
  }else{
    b.style.cssText = 'position:absolute;right:62px;top:22px;z-index:20';
    stage.appendChild(b);
  }
})();
</script>
</body>
</html>
