<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Mastering UI for Vibe Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#050A1A; --bg2:#0A1230; --card:#0B1530; --card2:#0F1C3D;
  --line:rgba(120,160,255,.2);
  --cyan:#22E5FF; --blue:#3B82F6; --violet:#A855F7; --pink:#EC4899;
  --green:#22C55E; --red:#EF4444; --amber:#F59E0B; --yellow:#FACC15;
  --text:#F1F5FF; --muted:#9AA8C7; --soft:#C9D4F2;
  --grad:linear-gradient(90deg,#22E5FF,#3B82F6 35%,#A855F7 68%,#EC4899);
  --ease:cubic-bezier(.22,1,.36,1);
  --f-head:'Montserrat',system-ui,'Segoe UI',sans-serif;
  --f-body:'Poppins',system-ui,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02040B;color:var(--text);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

/* ============ STAGE ============ */
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:var(--bg);box-shadow:0 0 80px rgba(0,0,0,.6)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(70px) scale(.985);
  transition:opacity .55s var(--ease),transform .7s var(--ease),visibility 0s linear .7s}
.slide.past{transform:translateX(-70px) scale(.985)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .55s var(--ease),transform .7s var(--ease),visibility 0s}
.slide.img{background:#050A1A}
.slide.img img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:reduce){.slide,.slide.past{transform:none;transition:opacity .2s,visibility 0s linear .2s}}

/* ============ PLAYGROUND SHELL ============ */
.slide.pg{display:flex;flex-direction:column;padding:42px 80px 44px;
  background:
    radial-gradient(1000px 640px at 100% 0%,rgba(30,91,255,.32),transparent 62%),
    radial-gradient(900px 600px at 0% 100%,rgba(91,31,209,.25),transparent 62%),
    linear-gradient(160deg,#050A1A,#0A1230)}
.slide.pg::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(120,160,255,.18) 1px,transparent 1px);background-size:36px 36px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.slide.pg>*{position:relative}
.pg-head{display:flex;align-items:center;gap:26px;height:58px}
.pg-badge{font:700 30px var(--f-head);padding:6px 18px;border:2px solid rgba(80,140,255,.55);border-radius:12px;background:rgba(15,30,70,.55);letter-spacing:.02em}
.pg-badge span{color:var(--cyan);margin-left:8px}
.pg-line{flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--cyan),#8B9CFF 22%,rgba(236,72,153,.55) 40%,rgba(236,72,153,.1) 70%,transparent)}
.pg-reset{display:flex;align-items:center;gap:10px;height:50px;padding:0 20px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:var(--soft);font:600 20px var(--f-head);cursor:pointer;transition:all .25s var(--ease)}
.pg-reset:hover{background:rgba(255,255,255,.1);color:#fff}
.pg-reset:hover svg{transform:rotate(-180deg)}
.pg-reset svg{transition:transform .5s var(--ease)}
.pg-pill{display:flex;align-items:center;gap:12px;font:800 20px var(--f-head);letter-spacing:.14em;padding:12px 22px;border-radius:999px;border:1.5px solid rgba(34,229,255,.55);color:var(--cyan);background:rgba(34,229,255,.08)}
.pg-pill i{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.pg-title{font:800 62px/1.1 var(--f-head);margin:20px 0 6px;letter-spacing:-.01em}
.pg-title small{font-weight:700;color:#DCE4FA}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pg-sub{font-size:27px;color:#C3CEEA;margin:0 0 24px}
.pg-body{flex:1;min-height:0;display:grid;grid-template-columns:600px 1fr;gap:34px}
.pg-ctrl{display:flex;flex-direction:column;gap:20px;min-height:0}
.pg-main{display:flex;flex-direction:column;gap:20px;min-height:0;min-width:0}
.panel{background:linear-gradient(180deg,rgba(15,28,61,.92),rgba(10,20,46,.92));border:1.5px solid var(--line);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 60px rgba(0,0,0,.35)}
.pg-preview{position:relative;flex:1;min-height:0;padding:30px;overflow:hidden;display:flex;flex-direction:column}
.pv-label{font:700 17px var(--f-head);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.pv-label::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.ctl-box{padding:24px 26px;display:flex;flex-direction:column;gap:22px}
.tip{margin-top:auto;display:flex;gap:14px;align-items:flex-start;font-size:22px;line-height:1.42;color:#DCE4F8;padding:16px 20px;border-radius:18px;background:rgba(250,204,21,.07);border:1.5px solid rgba(250,204,21,.32)}
.tip .ti{font-size:28px;line-height:1.1;color:var(--yellow)}
.tip b{color:var(--yellow);font-weight:600}

/* ============ CONTROLS ============ */
.ctl{display:flex;flex-direction:column;gap:10px}
.ctl-label{font:700 23px var(--f-head);color:var(--soft);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ctl-label b{font:700 28px var(--f-mono);color:var(--cyan)}
.ctl-label em{font:500 18px var(--f-mono);font-style:normal;color:var(--muted)}
.stepper{display:flex;align-items:stretch;height:64px;border-radius:16px;background:#060E24;border:1.5px solid rgba(90,140,255,.32);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.stepper:focus-within{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,229,255,.18)}
.stepper button{width:58px;flex:none;border:0;background:rgba(59,130,246,.14);color:#fff;font:600 34px/1 var(--f-head);cursor:pointer;transition:background .2s;user-select:none;touch-action:none}
.stepper button:hover{background:rgba(34,229,255,.28)}
.stepper button:active{background:rgba(34,229,255,.45)}
.stepper input{flex:1;min-width:0;width:0;text-align:center;background:transparent;border:0;color:#fff;font:700 34px var(--f-mono);outline:none;padding:0}
.stepper .unit{align-self:center;font:500 20px var(--f-mono);color:var(--muted);padding-right:10px}
.stepper.sm{height:58px}
.stepper.sm button{width:48px;font-size:30px}
.stepper.sm input{font-size:30px}
.sides{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px;align-items:end}
.side small{display:block;text-align:center;font:700 16px var(--f-head);letter-spacing:.06em;white-space:nowrap;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.side small span{text-transform:none;font:500 15px var(--f-mono);letter-spacing:0;color:#6F80A8;margin-left:4px}
.side.t{grid-column:2;grid-row:1}.side.l{grid-column:1;grid-row:2}.side.r{grid-column:3;grid-row:2}.side.b{grid-column:2;grid-row:3}
.side-c{grid-column:2;grid-row:2;height:58px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--f-head);letter-spacing:.12em;color:var(--sc);border:2px dashed var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;margin:0}
.rng::-webkit-slider-runnable-track{height:12px;border-radius:8px;background:linear-gradient(90deg,var(--cyan),var(--violet)) 0/var(--p,50%) 100% no-repeat,#18244A}
.rng::-moz-range-track{height:12px;border-radius:8px;background:#18244A}
.rng::-moz-range-progress{height:12px;border-radius:8px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;background:#fff;border:5px solid var(--cyan);box-shadow:0 0 0 6px rgba(34,229,255,.15),0 4px 14px rgba(0,0,0,.5);transition:transform .15s}
.rng::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--cyan)}
.rng:active::-webkit-slider-thumb{transform:scale(1.15)}
.rng:focus{outline:none}
.rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 8px rgba(34,229,255,.35)}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:#060E24;border:1.5px solid rgba(90,140,255,.26);border-radius:16px}
.seg.grid{display:grid}
.seg button{flex:1 1 auto;min-height:52px;padding:0 14px;border:0;border-radius:11px;background:transparent;color:#AEBEE4;font:700 21px var(--f-head);cursor:pointer;transition:all .25s var(--ease);white-space:nowrap}
.seg button:hover{color:#fff;background:rgba(255,255,255,.05)}
.seg button.on{color:#fff;background:linear-gradient(135deg,rgba(34,229,255,.28),rgba(168,85,247,.34));box-shadow:inset 0 0 0 1.5px rgba(34,229,255,.65),0 4px 16px rgba(34,229,255,.15)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:0;border:0;background:none;font:700 23px var(--f-head);color:var(--soft);cursor:pointer;text-align:left}
.tgl .sw{width:74px;height:42px;flex:none;border-radius:999px;background:#18244A;position:relative;transition:background .3s;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
.tgl .sw::after{content:'';position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:#fff;transition:transform .35s var(--ease);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tgl.on .sw{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.tgl.on .sw::after{transform:translateX(32px)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatches button{width:54px;height:54px;border-radius:15px;border:3px solid transparent;cursor:pointer;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.08);transition:all .25s var(--ease)}
.swatches button:hover{transform:translateY(-2px)}
.swatches button.on{border-color:#fff;box-shadow:0 0 0 3px var(--c0,var(--c)),0 0 22px var(--c0,var(--c))}
.act{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:0 24px;border-radius:16px;border:1.5px solid rgba(34,229,255,.5);background:linear-gradient(135deg,rgba(34,229,255,.18),rgba(168,85,247,.22));color:#fff;font:700 22px var(--f-head);cursor:pointer;transition:all .25s var(--ease)}
.act:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,229,255,.25)}
.act:active{transform:translateY(1px) scale(.98)}
.act svg{font-size:26px}
.txt-in{height:62px;border-radius:16px;background:#060E24;border:1.5px solid rgba(90,140,255,.32);color:#fff;font:700 28px var(--f-head);padding:0 20px;outline:none;width:100%}
.txt-in:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,229,255,.18)}

/* ============ CODE PANEL ============ */
.code-panel{overflow:hidden;flex:none}
.code-bar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid rgba(120,160,255,.14);background:rgba(0,0,0,.18)}
.code-bar i{width:13px;height:13px;border-radius:50%;background:#FF5F57}
.code-bar i:nth-child(2){background:#FEBC2E}.code-bar i:nth-child(3){background:#28C840}
.code-bar span{margin-left:10px;font:600 17px var(--f-mono);color:var(--muted)}
.code{margin:0;padding:16px 24px 18px;font:500 23px/1.55 var(--f-mono);color:#D6E2FF;white-space:pre;overflow:hidden}
.code .s{color:#F472B6}.code .p{color:#7DD3FC}.code .c{color:#61729B;font-style:italic}.code .t{color:#F472B6}.code .a{color:#C4B5FD}
.code .v{color:#FDE68A;border-radius:6px}
.code .v.f{animation:flash 1.1s var(--ease)}
.code .hl{background:rgba(34,229,255,.14);box-shadow:-24px 0 0 rgba(34,229,255,.14),24px 0 0 rgba(34,229,255,.14);display:inline-block;min-width:100%}
@keyframes flash{0%{background:rgba(34,229,255,.55);color:#fff}100%{background:transparent}}
.code-hint{margin-left:auto;display:flex;align-items:center;gap:7px;font:600 15px var(--f-head);font-style:normal;color:#7C8DB8;letter-spacing:.02em}
.code-rev{display:none;margin-left:auto;align-items:center;gap:7px;font:700 15px var(--f-head);color:#001018;background:var(--cyan);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.code-panel.dirty .code-hint{display:none}.code-panel.dirty .code-rev{display:flex}
.code-panel.editable .code{cursor:text;outline:none;overflow:auto;scrollbar-width:none;transition:box-shadow .25s}
.code-panel.editable .code::-webkit-scrollbar{display:none}
.code-panel.editable:hover .code{box-shadow:inset 0 0 0 2px rgba(34,229,255,.18)}
.code-panel.editable .code:focus{box-shadow:inset 0 0 0 2px rgba(34,229,255,.6);background:rgba(34,229,255,.04)}
.code-panel.editable .code:focus .v.f{animation:none}

/* ============ NAV UI ============ */
#progress{position:fixed;top:0;left:0;height:4px;width:0;background:var(--grad);z-index:20;transition:width .6s var(--ease);box-shadow:0 0 14px rgba(34,229,255,.6)}
body.idle{cursor:none}
#overview{position:fixed;inset:0;z-index:40;background:rgba(3,6,16,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:auto;padding:36px 52px 60px;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s linear .35s}
#overview.open{opacity:1;visibility:visible;transition:opacity .35s}
.ov-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.ov-head h3{margin:0;font:800 28px var(--f-head)}
.ov-head button{border:1px solid rgba(255,255,255,.2);background:none;color:#fff;border-radius:999px;padding:10px 20px;font:600 15px var(--f-head);cursor:pointer}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.ov-item{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;cursor:pointer;background:#0B1530;border:2px solid rgba(120,160,255,.15);transition:transform .25s var(--ease),border-color .25s}
.ov-item:hover{transform:translateY(-4px);border-color:rgba(34,229,255,.6)}
.ov-item.cur{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,229,255,.25)}
.ov-item img{width:100%;height:100%;object-fit:cover;display:block}
.ov-num{position:absolute;right:8px;bottom:8px;font:800 13px var(--f-head);background:rgba(0,0,0,.65);padding:3px 9px;border-radius:7px}
.ov-pg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:14px;background:radial-gradient(260px 160px at 100% 0%,rgba(30,91,255,.4),transparent),linear-gradient(160deg,#0A1230,#120F3A)}
.ov-pg span{align-self:flex-start;font:800 10px var(--f-head);letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(34,229,255,.5);border-radius:999px;padding:3px 9px}
.ov-pg b{font:800 17px/1.2 var(--f-head)}

/* ---- 05 Padding / Margin ---- */
.bx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:stretch}
.bx-wrap{display:flex;flex-direction:column;position:relative;border-radius:24px;transition:background .3s}
.bx-card{flex:1;position:relative;border:3px solid rgba(96,165,250,.95);border-radius:22px;background:#0C1A3E;transition:padding .4s var(--ease),margin .4s var(--ease),background .3s}
.zones-p .bx-card{background:repeating-linear-gradient(45deg,rgba(34,229,255,.32) 0 10px,rgba(34,229,255,.12) 10px 20px)}
.zones-p .bx-content{background:rgba(59,130,246,.42);outline:2px dashed rgba(191,219,254,.8);outline-offset:-1px}
.zones-m .bx-wrap{background:repeating-linear-gradient(-45deg,rgba(236,72,153,.34) 0 10px,rgba(236,72,153,.12) 10px 20px);outline:2px dashed rgba(244,114,182,.85);outline-offset:-2px}
.bx-content{border-radius:10px;transition:background .3s}
.bx-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.bx-content h4{font:800 30px var(--f-head);margin:12px 0 4px}
.bx-content p{font-size:21px;line-height:1.4;color:#C8D3EE;margin:0 0 12px}
.bx-price{font:800 36px var(--f-head);margin-bottom:12px;white-space:nowrap}
.bx-price small{font:500 18px var(--f-body);color:var(--muted);margin-left:4px}
.bx-btn{display:block;text-align:center;padding:13px;border-radius:12px;background:linear-gradient(90deg,#3B82F6,#8B5CF6);font:700 21px var(--f-head)}
.bx-tag{position:absolute;z-index:3;font:700 17px/1 var(--f-mono);font-style:normal;color:#001018;background:var(--tc,#22E5FF);padding:5px 8px;border-radius:7px;transform:translate(-50%,-50%);transition:all .4s var(--ease);pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.bx-tag.t{left:50%;top:calc(var(--zt)/2)}.bx-tag.b{left:50%;top:calc(100% - var(--zb)/2)}
.bx-tag.l{top:50%;left:calc(var(--zl)/2)}.bx-tag.r{top:50%;left:calc(100% - var(--zr)/2)}
.bx-tag.hide{opacity:0}
.legend{display:flex;gap:30px;margin-top:auto;padding-top:18px;font:600 20px var(--f-head);color:var(--soft)}
.legend span{display:flex;align-items:center;gap:10px}
.legend i{width:26px;height:26px;border-radius:7px}
.p5-stack{display:flex;flex-direction:column;gap:22px;transform-origin:top center;transition:transform .35s var(--ease)}
.p5-sec .pv-label{margin-bottom:14px}
.pv-label.pv-act::before{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.p5-legend{margin-left:auto;display:flex;gap:22px;font:600 17px var(--f-head);letter-spacing:0;text-transform:none;color:var(--soft)}
.p5-legend span{display:flex;align-items:center;gap:8px}
.p5-legend i{width:20px;height:20px;border-radius:5px}
.bx-real .bx-card{border:1.5px solid rgba(120,160,255,.28);background:linear-gradient(160deg,#10204A,#0B1532);box-shadow:0 14px 34px rgba(0,0,0,.35)}
[data-pg="p5a"] .pg-ctrl .code,[data-pg="p5b"] .pg-ctrl .code{font-size:20px;white-space:pre-wrap}
.mg-cap{font:600 19px var(--f-mono);color:var(--muted);margin-bottom:12px}
.mg-row{display:flex;align-items:stretch;width:max-content;max-width:100%;outline:3px dashed rgba(255,255,255,.3);border-radius:14px;transition:all .4s var(--ease)}
.mg-row .bx-card{width:270px}
.mg-row .bx-content p{font-size:19px}
.p5-sec .mg-row{margin:0 auto}
.mg-row.bx-real{outline:none}

/* ---- 06 Visual styling ---- */
.ty-card{--pri:#3B82F6;--acc:#22E5FF;flex:1;min-height:0;border-radius:26px;padding:40px 52px;display:flex;flex-direction:column;justify-content:center;gap:22px;overflow:hidden;
  background:radial-gradient(700px 340px at 95% 0%,color-mix(in srgb,var(--pri) 38%,transparent),transparent 70%),radial-gradient(600px 320px at 0% 100%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 70%),#081230;
  border:1.5px solid color-mix(in srgb,var(--pri) 50%,transparent);transition:border-color .5s,background .5s}
.ty-eye{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font:800 18px var(--f-head);letter-spacing:.14em;color:var(--acc);padding:10px 18px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 10%,transparent);transition:all .5s}
.ty-h{margin:0;font-family:var(--f-head);font-size:var(--hs);font-weight:var(--hw);line-height:1.1;letter-spacing:-.01em;transition:font-size .35s var(--ease)}
.ty-h span{color:var(--acc);transition:color .5s}
.ty-p{margin:0;font-size:var(--bs);line-height:var(--lh);color:#C3CEEA;max-width:880px;transition:font-size .35s var(--ease),line-height .35s var(--ease)}
.ty-btns{display:flex;gap:16px;margin-top:4px}
.ty-b1,.ty-b2{font:700 22px var(--f-head);padding:18px 30px;border-radius:14px;transition:all .5s}
.ty-b1{background:var(--pri);box-shadow:0 10px 30px color-mix(in srgb,var(--pri) 45%,transparent)}
.ty-b2{border:2px solid var(--acc);color:var(--acc)}
.ty-stack{display:flex;flex-direction:column;gap:6px;transform-origin:left center;transition:transform .3s var(--ease)}
.ty-r{display:flex;flex-direction:column;gap:18px;max-width:1000px;animation:fbIn .4s var(--ease)}
.ty-r:not(.on){display:none}
.ty-tag{display:flex;align-items:baseline;gap:14px;padding-bottom:14px;border-bottom:1.5px dashed color-mix(in srgb,var(--acc) 40%,transparent)}
.ty-tag b{font:800 30px var(--f-head);color:var(--acc);transition:color .5s}
.ty-tag small{font:500 20px var(--f-mono);color:var(--muted);white-space:nowrap}
.ty-t{margin:0;letter-spacing:-.005em;transition:font-size .35s var(--ease),line-height .35s var(--ease);}
.ty-h1,.ty-h2,.ty-h3,.ty-h4{font-family:var(--f-head);color:#fff;max-width:14em}
.ty-p1,.ty-p2{max-width:46em}
.ty-fix-p{margin:0;font:400 22px/1.6 var(--f-body);color:#9FB0D6;max-width:46em}
.ty-fix-h{font:700 34px/1.2 var(--f-head);color:#fff;margin-bottom:-4px}
.ty-h1 span{color:var(--acc);transition:color .5s}
.ty-p1{color:#D3DCF3}.ty-p2{color:#9FB0D6}
.ty-hint{margin-left:auto;font:600 15px var(--f-head);letter-spacing:.02em;text-transform:none;color:#7C8DB8}
[data-pg="p6a"] .ty-card{padding:36px 48px;justify-content:center}
[data-pg="p6a"] .code{font-size:20px;line-height:1.45;padding:10px 24px 12px}
.pal{display:inline-flex;margin-right:12px}.pal i{width:22px;height:22px;border-radius:50%;background:var(--c);margin-right:-7px;border:2px solid #060E24}
.sh-surface{flex:1;min-height:0;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:70px;transition:background .5s}
.sh-surface.dark{background:#081128}.sh-surface.light{background:#E8EDF7}
.sh-card{width:420px;padding:34px;background:#102043;color:#fff;transition:all .4s var(--ease)}
.light .sh-card{background:#fff;color:#0F172A}
.sh-card h4{font:800 32px var(--f-head);margin:18px 0 8px}
.sh-card p{font-size:21px;line-height:1.45;color:#B8C4E0;margin:0}
.light .sh-card p{color:#475569}
.sh-ic{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#3B82F6,#A855F7);color:#fff}
.sh-col{display:flex;flex-direction:column;align-items:center;gap:22px}
.sh-btn{--gc:#22E5FF;font:700 26px var(--f-head);display:inline-flex;gap:12px;align-items:center;padding:22px 38px;border:2px solid var(--gc);background:#0B1530;color:#fff;cursor:pointer;transition:all .4s var(--ease)}
.sh-cap{font-size:19px;color:var(--muted)}.light .sh-cap{color:#64748B}

/* ---- 07 Button ---- */
.bt-stage{flex:1;min-height:0;display:grid;place-items:center;border-radius:20px;background:radial-gradient(500px 240px at 50% 50%,rgba(59,130,246,.14),transparent 70%),repeating-linear-gradient(0deg,transparent 0 39px,rgba(120,160,255,.06) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(120,160,255,.06) 39px 40px)}
.dbtn{--bg:#3B82F6;--fg:#fff;--bd:#3B82F6;--glow:rgba(59,130,246,.6);--r:14px;--fs:26px;--py:18px;--px:34px;
  display:inline-flex;align-items:center;gap:12px;font:700 var(--fs) var(--f-head);padding:var(--py) var(--px);border-radius:var(--r);background:var(--bg);color:var(--fg);border:2px solid var(--bd);cursor:pointer;transition:all .25s var(--ease);outline:4px solid transparent;outline-offset:5px}
.dbtn.v-secondary{--bg:#16213F;--fg:#DBEAFE;--bd:#3B82F6;--glow:rgba(59,130,246,.45)}
.dbtn.v-outline{--bg:transparent;--fg:#F9A8D4;--bd:#EC4899;--glow:rgba(236,72,153,.5)}
.dbtn.v-ghost{--bg:transparent;--fg:#CBD5E1;--bd:transparent;--glow:rgba(148,163,184,.25)}
.dbtn.v-danger{--bg:#EF4444;--bd:#EF4444;--glow:rgba(239,68,68,.55)}
.dbtn.v-success{--bg:#22C55E;--bd:#22C55E;--glow:rgba(34,197,94,.55)}
.dbtn:hover:not(:disabled),.dbtn.is-hover{filter:brightness(1.15);transform:translateY(-3px);box-shadow:0 12px 32px var(--glow),0 0 0 1px var(--glow)}
.dbtn.v-outline:hover,.dbtn.v-outline.is-hover{background:rgba(236,72,153,.14)}
.dbtn.v-ghost:hover,.dbtn.v-ghost.is-hover{background:rgba(255,255,255,.09)}
.dbtn:active:not(:disabled),.dbtn.is-active{transform:translateY(1px) scale(.96);filter:brightness(.85);box-shadow:none}
.dbtn:focus-visible,.dbtn.is-focus{outline-color:var(--cyan);box-shadow:0 0 30px rgba(34,229,255,.45)}
.dbtn:disabled,.dbtn.is-disabled{opacity:.4;filter:grayscale(.85);cursor:not-allowed;transform:none;box-shadow:none}
.dbtn.forced{pointer-events:none}
.bt-info{display:flex;align-items:center;gap:18px;margin:20px 0 18px;font-size:24px;color:var(--soft)}
.bt-info b{font:800 22px var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:#001018;background:var(--cyan);padding:7px 14px;border-radius:9px}
.bt-info .bt-count{margin-left:auto;font:600 20px var(--f-mono);color:var(--muted)}
.bt-row{display:flex;gap:12px;flex-wrap:wrap}
.bt-row .dbtn{--fs:19px;--py:11px;--px:18px;--r:11px}
.bt-row .dbtn.sel{outline:2px dashed rgba(255,255,255,.55);outline-offset:4px}

/* ---- 08 Component states ---- */
.st-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px;padding:30px 34px;border-radius:22px;background:#0B1735;border:1.5px solid rgba(120,160,255,.18)}
.st-top{display:flex;align-items:center;gap:20px}
.st-av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:800 26px var(--f-head);background:linear-gradient(135deg,#3B82F6,#A855F7)}
.st-top b{display:block;font:800 28px var(--f-head)}
.st-top span{font-size:20px;color:var(--muted)}
.st-save{margin-left:auto;display:inline-flex;align-items:center;gap:12px;font:700 22px var(--f-head);padding:16px 30px;border-radius:14px;border:0;background:linear-gradient(90deg,#3B82F6,#8B5CF6);color:#fff;cursor:pointer;transition:all .3s}
.st-save:disabled{opacity:.7;cursor:progress}
.st-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.st-f label{display:block;font:600 18px var(--f-head);color:var(--muted);margin-bottom:8px}
.st-f div{height:58px;border-radius:12px;border:1.5px solid rgba(120,160,255,.25);background:#071027;display:flex;align-items:center;padding:0 18px;font-size:22px}
.st-fb{flex:1;min-height:0;display:flex;align-items:center}
.fb{width:100%;display:flex;align-items:center;gap:22px;padding:26px 30px;border-radius:18px;border:2px solid var(--fc);background:color-mix(in srgb,var(--fc) 12%,#0B1735);animation:fbIn .5s var(--ease)}
.fb>svg{font-size:46px;color:var(--fc)}
.fb b{display:block;font:800 28px var(--f-head);color:#fff}
.fb span{font-size:22px;color:#C8D3EE}
.fb-btn{margin-left:auto;font:700 20px var(--f-head);padding:14px 22px;border-radius:12px;border:1.5px solid var(--fc);background:transparent;color:#fff;cursor:pointer}
.fb-load{--fc:#22E5FF}.fb-ok{--fc:#22C55E}.fb-err{--fc:#EF4444}.fb-empty{--fc:#A855F7;border-style:dashed}.fb-info{--fc:#818CF8}
.spin{width:var(--sz,46px);height:auto;aspect-ratio:1;flex:none;border-radius:50%;background:conic-gradient(from 0deg,transparent 10%,var(--cyan) 60%,var(--violet));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:spin var(--spd,1s) linear infinite}
.spin.sm{--sz:26px;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));background:conic-gradient(transparent 10%,#fff)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fbIn{from{opacity:0;transform:translateY(16px) scale(.98)}}

/* ---- 09 Navigation ---- */
.br{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;border:1.5px solid rgba(120,160,255,.22);background:#0A1330}
.br-bar{display:flex;align-items:center;gap:8px;padding:12px 18px;background:#0E1A3D;border-bottom:1px solid rgba(120,160,255,.14)}
.br-bar>i{width:13px;height:13px;border-radius:50%;background:#FF5F57}.br-bar>i:nth-child(2){background:#FEBC2E}.br-bar>i:nth-child(3){background:#28C840}
.br-url{margin-left:16px;flex:1;max-width:620px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:500 18px var(--f-mono);color:#9FB0D6;background:#071027;border-radius:9px;padding:8px 16px}
.br-url b{color:#fff;font-weight:500}
.nv-head{--ac:#22E5FF;display:flex;align-items:center;gap:18px;padding:16px 26px;border-bottom:1px solid rgba(120,160,255,.14);background:#0C1838}
.nv-logo{display:flex;align-items:center;gap:10px;font:800 25px var(--f-head);white-space:nowrap}
.nv-logo span{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#22E5FF,#A855F7);color:#fff}
.nv-links{display:flex;gap:4px}
.nv-links a{position:relative;font:600 20px var(--f-head);color:#A9B8DC;padding:12px 11px;border-radius:12px;cursor:pointer;transition:all .3s var(--ease);text-decoration:none;white-space:nowrap}
.nv-links a:hover{color:#fff}
.nv-links a::after{content:'';position:absolute;left:11px;right:11px;bottom:3px;height:3px;border-radius:3px;background:var(--ac);transform:scaleX(0);transition:transform .35s var(--ease)}
.s-underline .nv-links a.on{color:var(--ac)}
.s-underline .nv-links a.on::after{transform:scaleX(1)}
.s-pill .nv-links a.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.s-glow .nv-links a.on{color:#fff;text-shadow:0 0 14px var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac),0 0 22px color-mix(in srgb,var(--ac) 40%,transparent)}
.nv-search{flex:0 1 270px;min-width:0;display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:12px;background:#071027;border:1.5px solid rgba(120,160,255,.2);color:#7385AE;font-size:19px;white-space:nowrap;overflow:hidden;transition:all .35s var(--ease)}
.nv-search.off{flex:0;width:0;padding:0;border-width:0;opacity:0}
.nv-icons{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:26px;color:#C3CEEA}
.nv-bell{position:relative;display:grid}
.nv-bell i{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #0C1838}
.nv-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--f-head);background:linear-gradient(135deg,#F472B6,#A855F7);color:#fff}
.nv-crumb{display:flex;align-items:center;gap:6px;padding:18px 28px 0;font:600 20px var(--f-head);color:#8394BC;overflow:hidden;max-height:60px;transition:all .35s var(--ease)}
.nv-crumb.off{max-height:0;padding-top:0;opacity:0}
.nv-crumb a{cursor:pointer;padding:4px 8px;border-radius:8px;transition:all .2s;display:flex;align-items:center;gap:8px}
.nv-crumb a:hover{background:rgba(255,255,255,.07);color:#fff}
.nv-crumb a.last{color:#fff;cursor:default;background:none}
.nv-crumb svg{font-size:18px;color:#4F5F88}
.nv-page{height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:22px 28px;animation:fbIn .45s var(--ease)}
.nv-wrap{flex:1;min-height:0}
.nv-prods{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}
.nv-prods div{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:#0F1C40;border:1px solid rgba(120,160,255,.15);min-height:0}
.nv-prods i{flex:1;min-height:40px;border-radius:11px;margin-bottom:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#0B1530),color-mix(in srgb,var(--c) 25%,#0B1530))}
.nv-prods b{font:700 20px var(--f-head)}
.nv-prods span{font-size:17px;color:var(--muted)}
.nv-page h3{font:800 44px var(--f-head);margin:0 0 8px}
.nv-page p{font-size:21px;color:var(--muted);margin:0 0 22px}
.nv-blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.nv-blocks div{border-radius:16px;padding:22px;background:#0F1C40;border:1px solid rgba(120,160,255,.15);display:flex;align-items:center;gap:14px;font:700 21px var(--f-head)}
.nv-blocks svg{font-size:30px;color:var(--cyan)}
.mb-wrap{flex:1;min-height:0;display:flex;gap:30px;align-items:stretch}
.phone{position:relative;width:330px;flex:none;border-radius:42px;border:8px solid #1B2A52;background:#081128;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.ph-status{display:flex;justify-content:space-between;padding:12px 24px 4px;font:700 16px var(--f-head);color:#DCE6FF}
.ph-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(120,160,255,.14)}
.ph-head .nv-logo{font-size:20px;margin-right:auto}.ph-head .nv-logo span{width:30px;height:30px;font-size:16px}
.ph-head>span,.ph-burger{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;font-size:24px;color:#DCE6FF;background:none;border:0}
.ph-burger{cursor:pointer;background:rgba(34,229,255,.12);box-shadow:inset 0 0 0 1.5px rgba(34,229,255,.5);animation:ping 2s infinite}
@keyframes ping{50%{box-shadow:inset 0 0 0 1.5px rgba(34,229,255,.5),0 0 0 6px rgba(34,229,255,.12)}}
.ph-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.ph-hero{height:150px;border-radius:16px;background:linear-gradient(135deg,#1E3A8A,#6D28D9);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;font:800 22px var(--f-head)}
.ph-line{height:16px;border-radius:8px;background:#16244B}
.ph-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ph-cards i{height:96px;border-radius:14px;background:#122047}
.ph-ov{position:absolute;inset:0;background:rgba(2,6,20,.6);opacity:0;pointer-events:none;transition:opacity .35s;z-index:4}
.ph-drawer{position:absolute;top:0;bottom:0;right:0;width:80%;z-index:5;background:#0D1A3D;border-left:1.5px solid rgba(120,160,255,.25);padding:26px 18px;display:flex;flex-direction:column;gap:6px;transform:translateX(105%);transition:transform .45s var(--ease)}
.phone.left .ph-drawer{right:auto;left:0;border-left:0;border-right:1.5px solid rgba(120,160,255,.25);transform:translateX(-105%)}
.phone.open .ph-drawer{transform:none}.phone.open .ph-ov{opacity:1;pointer-events:auto}
.ph-dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font:800 24px var(--f-head)}
.ph-dh button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:22px;display:grid;place-items:center;cursor:pointer}
.ph-drawer a{display:flex;align-items:center;gap:14px;padding:14px 14px;border-radius:12px;font:600 21px var(--f-head);color:#B9C6E8;cursor:pointer}
.ph-drawer a svg{font-size:22px}
.ph-drawer a.on{background:rgba(34,229,255,.14);color:var(--cyan)}
.dash{flex:1;min-width:0;display:flex;border-radius:20px;overflow:hidden;border:1.5px solid rgba(120,160,255,.22);background:#091230}
.sb{width:250px;flex:none;display:flex;flex-direction:column;gap:4px;padding:22px 14px;background:#0C1838;border-right:1px solid rgba(120,160,255,.14);transition:width .45s var(--ease);overflow:hidden}
.sb-logo{display:flex;align-items:center;gap:12px;padding:0 8px 16px;font:800 24px var(--f-head);white-space:nowrap}
.sb-logo span{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#22E5FF,#A855F7)}
.sb-sec{font:700 14px var(--f-head);letter-spacing:.14em;color:#5D6D96;padding:12px 12px 6px;white-space:nowrap}
.sb a{position:relative;display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:12px;font:600 20px var(--f-head);color:#A9B8DC;cursor:pointer;white-space:nowrap;transition:all .25s}
.sb a svg{font-size:24px}
.sb a:hover{background:rgba(255,255,255,.05);color:#fff}
.sb a.on{background:linear-gradient(90deg,rgba(34,229,255,.2),rgba(168,85,247,.12));color:#fff}
.sb a.on::before{content:'';position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--cyan)}
.sb .lbl{transition:opacity .25s}
.sb-col{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:12px;border:1px solid rgba(120,160,255,.2);background:none;color:#A9B8DC;font:600 18px var(--f-head);cursor:pointer;white-space:nowrap}
.sb-col svg{font-size:22px;transition:transform .45s var(--ease)}
.dash.collapsed .sb{width:86px}.dash.collapsed .lbl,.dash.collapsed .sb-sec{opacity:0}.dash.collapsed .sb-col svg{transform:rotate(180deg)}
.db-main{flex:1;min-width:0;padding:24px;display:flex;flex-direction:column;gap:18px}
.db-main h4{margin:0;font:800 32px var(--f-head);animation:fbIn .4s var(--ease)}
.db-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.db-stats div{padding:16px;border-radius:14px;background:#0F1C40;border:1px solid rgba(120,160,255,.15)}
.db-stats span{display:block;font-size:16px;color:var(--muted)}.db-stats b{font:800 24px var(--f-head);white-space:nowrap}
.db-chart{flex:1;border-radius:14px;background:#0F1C40;border:1px solid rgba(120,160,255,.15);display:flex;align-items:flex-end;gap:12px;padding:20px}
.db-chart i{flex:1;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#22E5FF,#3B82F6 60%,#6D28D9)}

.pg-ctrl .code{font-size:20px}

/* ---- 10 Forms ---- */
.fm{--r:12px;--h:60px;--ac:#22E5FF;--ring:4px;flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto 1fr;gap:30px;min-height:0}
.fm-col{display:flex;flex-direction:column;gap:28px;min-width:0}
.fm .lb{display:block;font:600 19px var(--f-head);color:var(--soft);margin-bottom:9px}
.fm-in{position:relative;display:flex;align-items:center;height:var(--h);border-radius:var(--r);background:#071027;border:1.5px solid rgba(120,160,255,.28);transition:all .25s var(--ease)}
.fm-in:focus-within,.fm-dd.open .fm-in{border-color:var(--ac);box-shadow:0 0 0 var(--ring) color-mix(in srgb,var(--ac) 32%,transparent)}
.fm-in>svg{margin-left:16px;font-size:22px;color:#6F80A8}
.fm-in input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:#fff;font:500 21px var(--f-body);padding:0 14px}
.fm-in input::placeholder{color:#5D6D96}
.fm-eye{border:0;background:none;color:#8FA0C8;font-size:24px;padding:0 14px;cursor:pointer;display:grid;place-items:center;height:100%}
.fm-dd{position:relative}
.fm-dd .fm-in{width:100%;justify-content:space-between;padding:0 16px;cursor:pointer;color:#fff;font:500 21px var(--f-body);text-align:left}
.fm-dd .fm-in svg{margin:0;transition:transform .3s}
.fm-dd.open .fm-in svg{transform:rotate(180deg)}
.fm-dd-list{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#0D1A3D;border:1.5px solid rgba(120,160,255,.3);border-radius:var(--r);padding:6px;z-index:5;opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .25s var(--ease);box-shadow:0 20px 40px rgba(0,0,0,.55)}
.fm-dd.open .fm-dd-list{opacity:1;transform:none;pointer-events:auto}
.fm-dd-list div{padding:12px 14px;border-radius:9px;font-size:20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}

.sk-l{height:16px}
.real{animation:fbIn .5s var(--ease)}
.real.sk-ban{display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px;background:linear-gradient(135deg,#1D4ED8,#7C3AED);font:800 24px var(--f-head)}
.real.sk-ban span{font:500 17px var(--f-body);opacity:.85}
.real .sk-av{display:grid;place-items:center;font:800 20px var(--f-head);background:var(--c)}
.real b{font:700 21px var(--f-head)}.real span{font-size:17px;color:var(--muted)}
.real .tm{margin-left:auto;font:600 15px var(--f-mono);color:#6F80A8}

/* ---- 14 Page layout ---- */
.pl{flex:1;min-height:0;display:grid;grid-template-columns:1fr 470px;gap:24px}
.pl .code{font-size:19px}
.wf{display:flex;flex-direction:column;gap:6px;min-height:0;border-radius:16px;padding:10px;background:#060D22;border:1.5px solid rgba(120,160,255,.18);overflow:hidden}
.wf-s{--c:#22E5FF;position:relative;border-radius:10px;background:#0E1A3C;border:2px solid transparent;max-height:300px;overflow:hidden;transition:all .45s var(--ease);cursor:pointer;font-size:15px;color:#C3CEEA}
.wf-s.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent),0 0 30px color-mix(in srgb,var(--c) 35%,transparent);z-index:2}
.wf-s.off{max-height:0;border-width:0;margin-top:-6px;opacity:0}
.wf-tag{position:absolute;right:8px;top:8px;z-index:3;font:700 14px var(--f-mono);padding:4px 9px;border-radius:7px;background:var(--c);color:#001018;opacity:0;transform:translateY(-4px);transition:all .25s}
.wf-s.on .wf-tag{opacity:1;transform:none}
.wf-n{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--f-head);background:var(--c);color:#001018;z-index:2}
.wf-top{padding:9px 44px;text-align:center;background:linear-gradient(90deg,#7C2D12,#B45309)}
.wf-head{display:flex;align-items:center;gap:16px;padding:14px 18px 14px 44px}
.wf-head .nv-logo{font-size:17px}.wf-head .nv-logo span{width:24px;height:24px;font-size:12px;border-radius:7px}
.wf-head nav{display:flex;gap:14px;font-weight:600}.wf-head .ics{margin-left:auto;display:flex;gap:12px;font-size:18px}
.wf-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;padding:20px 20px 20px 44px;background:linear-gradient(135deg,#132B6B,#2A1A6B)}
.wf-hero h6{margin:0 0 8px;font:800 24px/1.15 var(--f-head);color:#fff}
.wf-hero p{margin:0 0 12px}
.wf-hero .cta{display:inline-block;padding:8px 14px;border-radius:8px;background:#3B82F6;color:#fff;font-weight:700}
.wf-hero .img{border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:48px;color:#9DB4F0}
.wf-main{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 16px 16px 44px}
.wf-main div{border-radius:9px;background:#152553;padding:12px 8px;text-align:center;font-weight:600;font-size:13px}
.wf-main svg{display:block;margin:0 auto 6px;font-size:22px;color:var(--cyan)}
.wf-foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;padding:16px 16px 16px 44px;background:#0A1430}
.wf-foot b{display:block;color:#fff;margin-bottom:6px}
.wf-foot i{display:block;height:7px;border-radius:4px;background:#1C2B57;margin:7px 0;width:80%}
.wf-bot{display:flex;justify-content:space-between;padding:10px 18px 10px 44px;background:#070F26;font-size:13px}
.pl-t{display:flex;align-items:center;gap:14px;font-size:21px}
.pl-t i{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 16px var(--f-head);font-style:normal;background:var(--c);color:#001018}
.pl-t code{font:500 16px var(--f-mono);color:var(--muted)}
.pl-rows{display:flex;flex-direction:column;gap:6px}
.pl-rows .tgl{padding:8px 10px;border-radius:12px;transition:background .2s}
.pl-rows .tgl:hover,.pl-rows .tgl.hv{background:rgba(255,255,255,.06)}
.code .off{opacity:.3;text-decoration:line-through}

/* ---- 15 Responsive ---- */
.rs-read{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.rs-read b{font:800 40px var(--f-mono)}
.rs-bp{font:800 22px var(--f-head);padding:8px 16px;border-radius:10px;background:var(--bc);color:#001018;transition:background .3s}
.rs-read span{font-size:21px;color:var(--soft)}
.rs-area{position:relative;flex:1;min-height:0}
.rs-frame{position:absolute;top:0;bottom:0;left:0;border-radius:14px;overflow:hidden;border:2px solid rgba(120,160,255,.35);background:#081028;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.rs-handle{position:absolute;top:50%;width:26px;height:110px;margin-top:-55px;border-radius:10px;background:linear-gradient(180deg,#22E5FF,#A855F7);cursor:ew-resize;display:grid;place-items:center;touch-action:none;box-shadow:0 0 20px rgba(34,229,255,.4)}
.rs-handle::before{content:'';width:4px;height:44px;border-radius:2px;border-left:2px solid rgba(0,0,0,.45);border-right:2px solid rgba(0,0,0,.45)}
.rs-site{transform-origin:0 0;font-family:var(--f-body);color:#E5ECFF;overflow-y:auto;scrollbar-width:none}
.rs-site::-webkit-scrollbar{display:none}
.rs-top{background:linear-gradient(90deg,#7C2D12,#B45309);text-align:center;font-size:15px;padding:8px}
.rs-head{display:flex;align-items:center;gap:22px;padding:16px 28px;background:#0C1838;border-bottom:1px solid rgba(120,160,255,.15);position:relative}
.rs-head .nv-logo{font-size:22px}
.rs-links{display:flex;gap:22px;font:600 17px var(--f-head);color:#B9C6E8}
.rs-links span:first-child{color:var(--cyan)}
.rs-icons{margin-left:auto;display:flex;gap:16px;font-size:22px}
.rs-burger{display:none;width:44px;height:44px;border-radius:10px;border:0;background:rgba(34,229,255,.14);color:#fff;font-size:24px;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(34,229,255,.5)}
.rs-menu{display:none;flex-direction:column;background:#0D1A3D;border-bottom:1px solid rgba(120,160,255,.2)}
.rs-menu span{padding:14px 24px;font:600 18px var(--f-head);border-top:1px solid rgba(120,160,255,.1)}
.rs-site.menu-open .rs-menu{display:flex}
.rs-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:40px 28px;background:linear-gradient(135deg,#0F2463,#2A1466)}
.rs-hero h2{margin:0 0 12px;font:800 48px/1.1 var(--f-head)}
.rs-hero p{margin:0 0 20px;font-size:19px;color:#C3CEEA}
.rs-cta{display:inline-block;padding:14px 24px;border-radius:12px;background:#3B82F6;font:700 18px var(--f-head)}
.rs-img{height:220px;border-radius:18px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:90px;color:#9DB4F0}
.rs-img svg{stroke-width:1.3}
.rs-feat{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:28px}
.rs-feat div{border-radius:14px;background:#0F1C40;border:1px solid rgba(120,160,255,.15);padding:20px;font:700 18px var(--f-head)}
.rs-feat svg{display:block;font-size:30px;color:var(--cyan);margin-bottom:10px}
.rs-feat span{display:block;font:400 15px var(--f-body);color:var(--muted);margin-top:4px}
.bp-md .rs-links,.bp-sm .rs-links{display:none}
.bp-md .rs-burger,.bp-sm .rs-burger{display:grid}
.bp-sm .rs-icons .opt{display:none}
.bp-md .rs-hero,.bp-sm .rs-hero{grid-template-columns:1fr}
.bp-md .rs-hero h2{font-size:40px}.bp-sm .rs-hero h2{font-size:32px}
.bp-md .rs-img{height:160px}.bp-sm .rs-img{height:130px}
.bp-md .rs-feat{grid-template-columns:repeat(2,1fr)}
.bp-sm .rs-feat{grid-template-columns:1fr}
.bp-sm .rs-head,.bp-sm .rs-hero,.bp-sm .rs-feat{padding-left:18px;padding-right:18px}
.bp-xl .rs-hero{padding:56px 64px}.bp-xl .rs-head{padding:18px 64px}.bp-xl .rs-feat{padding:32px 64px}.bp-xl .rs-hero h2{font-size:56px}
.seg .bpl{display:flex;align-items:center;gap:8px}
.seg .bpl b{font:800 15px var(--f-mono);padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.12)}
.seg .bpl small{font:500 15px var(--f-mono);color:#8FA0C8}

/* ---- 16 Grid / Rows / Columns ---- */
.lp{flex:1;min-height:0;display:flex;flex-direction:column}
.lp>div{flex:1;min-height:0;animation:fbIn .45s var(--ease)}
.lp-grid{display:grid;grid-auto-rows:1fr;transition:gap .3s}
.lp-card{display:flex;flex-direction:column;gap:8px;border-radius:14px;background:#0F1C40;border:1px solid rgba(120,160,255,.16);padding:10px;min-height:0;overflow:hidden}
.lp-img{flex:1;min-height:30px;border-radius:9px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 75%,#0B1530),color-mix(in srgb,var(--c) 30%,#0B1530))}
.lp-l{height:11px;border-radius:6px;background:#22325F;flex:none}
.lp-rows{display:flex;flex-direction:column;transition:gap .3s}
.lp-row{flex:1;min-height:0;display:flex;gap:18px;align-items:center;border-radius:14px;background:#0F1C40;border:1px solid rgba(120,160,255,.16);padding:12px;overflow:hidden}
.lp-row .lp-img{flex:none;width:28%;height:100%}
.lp-row .tx{flex:1;display:flex;flex-direction:column;gap:10px}
.lp-row .tx b{font:800 22px var(--f-head)}
.lp-cols{display:grid;transition:all .45s var(--ease)}
.lp-side,.lp-main{border-radius:14px;background:#0F1C40;border:1px solid rgba(120,160,255,.16);padding:20px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.lp-side .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#22E5FF,#A855F7);flex:none}
.lp-side a{display:flex;align-items:center;gap:10px;font:600 18px var(--f-head);color:#B9C6E8;padding:8px 10px;border-radius:9px;white-space:nowrap}
.lp-side a:first-of-type{background:rgba(34,229,255,.14);color:var(--cyan)}
.lp-side a svg{font-size:20px;flex:none}
.lp-main b{font:800 28px var(--f-head)}
.lp-main .blocks{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lp-main .blocks i{border-radius:12px;background:linear-gradient(135deg,#1E3A8A,#4C1D95)}
.lp-lab{font:700 15px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.grp{display:flex;flex-direction:column;gap:20px}
.grp.hide{display:none}

/* ============ DECK ENGINE ============ */
const stage=$('#stage');let S=1;
function fit(){S=Math.min(innerWidth/1920,innerHeight/1080);stage.style.setProperty('--s',S)}
addEventListener('resize',fit);fit();

const slides=$$('.slide',stage);let cur=0;

slides.forEach(sec=>{
  if(sec.classList.contains('img')){
    const im=el('img');im.alt=sec.dataset.name||'';im.decoding='async';im.draggable=false;sec.append(im);
  }
});

function initPG(sec){
  const d=sec.dataset;
  if(!sec._tpl)sec._tpl=sec.innerHTML;else sec.innerHTML=sec._tpl;
  const head=el('header','pg-head',`<div class="pg-badge">${d.n}<span>${d.l}</span></div><div class="pg-line"></div><button class="pg-reset" type="button" title="Reset playground">${ic('reset')} Reset</button><div class="pg-pill"><i></i>LIVE PLAYGROUND</div>`);
  const t=el('h2','pg-title',`<small>Playground:</small> <span class="grad">${d.title}</span>`);
  const sub=el('p','pg-sub',d.sub||'');
  sec.prepend(head,t,sub);
  $('.pg-reset',sec).onclick=()=>{if(sec._cleanup)sec._cleanup();initPG(sec)};
  try{sec._cleanup=PG[d.pg]&&PG[d.pg](sec)}catch(err){console.error(d.pg,err)}
}
slides.filter(s=>s.classList.contains('pg')).forEach(initPG);

function load(i){const s=slides[i];if(!s||!s.classList.contains('img'))return;const im=$('img',s);if(!im.src)im.src=s.dataset.src}
function go(i){
  i=clamp(i,0,slides.length-1);
  if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  cur=i;
  slides.forEach((s,j)=>{s.classList.toggle('active',j===i);s.classList.toggle('past',j<i);s.setAttribute('aria-hidden',j!==i)});
  for(let k=-1;k<=2;k++)load(i+k);
  if(slides[i]._onShow)requestAnimationFrame(()=>slides[i]._onShow());
  $('#progress').style.width=((i+1)/slides.length*100)+'%';
  history.replaceState(null,'','#'+(i+1));
  $$('.ov-item').forEach((o,j)=>o.classList.toggle('cur',j===i));
}
const next=()=>go(cur+1),prev=()=>go(cur-1);

function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}

/* overview */
const ov=$('#overview'),ovGrid=$('#ovGrid');
slides.forEach((s,j)=>{
  const it=el('div','ov-item');
  if(s.classList.contains('img'))it.innerHTML=`<img loading="lazy" src="${s.dataset.src}" alt="">`;
  else it.innerHTML=`<div class="ov-pg"><span>PLAYGROUND ${s.dataset.n}·${s.dataset.l}</span><b>${s.dataset.title}</b></div>`;
  it.insertAdjacentHTML('beforeend',`<div class="ov-num">${j+1}</div>`);
  it.onclick=()=>{closeOv();go(j)};ovGrid.append(it);
});
function openOv(){ov.classList.add('open');setTimeout(()=>$('.ov-item.cur')?.scrollIntoView({block:'center'}),30)}
function closeOv(){ov.classList.remove('open')}
$('#ovClose').onclick=closeOv;

/* keyboard */
addEventListener('keydown',e=>{
  if(ov.classList.contains('open')){if(['Escape','o','O'].includes(e.key)){e.preventDefault();closeOv()}return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target,tag=t.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||t.isContentEditable;
  if(e.key==='PageDown'){e.preventDefault();next();return}
  if(e.key==='PageUp'){e.preventDefault();prev();return}
  if(typing){if(e.key==='Escape')t.blur();return}
  switch(e.key){
    case 'ArrowRight':case 'ArrowDown':e.preventDefault();next();break;
    case 'ArrowLeft':case 'ArrowUp':e.preventDefault();prev();break;
    case ' ':if(tag==='BUTTON')return;e.preventDefault();e.shiftKey?prev():next();break;
    case 'Home':e.preventDefault();go(0);break;
    case 'End':e.preventDefault();go(slides.length-1);break;
    case 'f':case 'F':fullscreen();break;
    case 'o':case 'O':openOv();break;
    case 'Escape':if(t!==document.body)t.blur();break;
  }
});

/* swipe (only outside interactive playground area) */
let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.target.closest('.pg-body')?null:e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)dx<0?next():prev();tx=null});

/* hide the cursor when idle */
