<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub for Vibe Coders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --text:#fff;
  --body:#E8E8EC;
  --line:rgba(255,255,255,.78);
  --green:#4BF03C;
  --green-glow:rgba(75,240,60,.55);
  --ease:cubic-bezier(.2,.8,.2,1);
  --cycle:4.5s;
  --loop:3.4s;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;cursor:pointer}

.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;
  background:radial-gradient(800px 600px at 74% 52%,rgba(255,255,255,.06),transparent 70%),
             radial-gradient(700px 500px at 8% 30%,rgba(255,255,255,.03),transparent 70%),var(--bg)}
.orb{position:absolute;width:760px;height:760px;border-radius:50%;left:1080px;top:120px;
  background:radial-gradient(circle,rgba(75,240,60,.07),transparent 65%);filter:blur(24px);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-100px,70px) scale(1.1)}}

/* ---------- Header ---------- */
.label{position:absolute;left:90px;top:64px;display:flex;align-items:center;gap:26px;font-size:32px;font-weight:700;letter-spacing:-.015em}
.label::before{content:"";width:2px;height:48px;background:#fff;transform-origin:top;animation:growY .6s .1s var(--ease) both}
.label span{animation:fadeRight .7s .25s var(--ease) both}

/* ---------- Copy ---------- */
h1{position:absolute;left:84px;top:196px;margin:0;font-size:142px;line-height:136px;font-weight:900;letter-spacing:-.045em}
h1 .ln{display:block;overflow:hidden;padding-bottom:10px}
h1 .ln > span{display:inline-block;animation:rise .9s var(--ease) both}
h1 .ln:nth-child(1) > span{animation-delay:.35s}
h1 .gh{background:linear-gradient(100deg,#fff 0%,#fff 35%,#9a9aa3 50%,#fff 65%,#fff 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .9s .5s var(--ease) both, sheen 4.5s 1.8s ease-in-out infinite}
@keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.bar{position:absolute;left:90px;top:504px;width:240px;height:13px;border-radius:7px;background:#fff;
  box-shadow:0 0 18px rgba(255,255,255,.45);transform-origin:left;animation:growX .8s 1s var(--ease) both}
.sub{position:absolute;left:90px;top:548px;width:820px;margin:0;font-size:44px;line-height:56px;font-weight:500;color:var(--body);letter-spacing:-.025em}
.sub span{display:block;animation:fadeUp .8s var(--ease) both}
.sub span:nth-child(1){animation-delay:1.1s}
.sub span:nth-child(2){animation-delay:1.3s;color:#fff;font-weight:700}

.meta{position:absolute;left:90px;top:732px;height:88px;padding:0 38px 0 26px;border-radius:44px;display:flex;align-items:center;gap:20px;
  border:2.5px solid rgba(255,255,255,.85);background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  box-shadow:0 0 22px rgba(255,255,255,.26),inset 0 0 20px rgba(255,255,255,.05);
  font-size:36px;font-weight:700;letter-spacing:-.02em;animation:pillIn .9s 1.6s var(--ease) both}
.meta svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.meta .hand{transform-box:view-box;transform-origin:12px 12px;animation:spin 6s 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meta i{font-style:normal;color:#9a9aa3;font-weight:500;margin:0 2px}

/* ---------- Visual ---------- */
.world{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.world *{transform-box:fill-box}
.laptop{animation:fadeUp .9s 1.3s var(--ease) both}
.bubble{transform-origin:left center;animation:chat var(--cycle) var(--loop) ease-in-out infinite;opacity:0}
.bubble.me{transform-origin:right center}
.b1{animation-delay:calc(var(--loop) + 0s)}
.b2{animation-delay:calc(var(--loop) + .35s)}
.b3{animation-delay:calc(var(--loop) + .7s)}
@keyframes chat{0%{opacity:0;transform:scale(.6)}8%,85%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}
.dots circle{animation:typing 1s ease-in-out infinite}
.dots circle:nth-child(2){animation-delay:.15s}
.dots circle:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.dots{animation:fadeIn .4s 2.2s both}

.ln{fill:none;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.main-ln{stroke:var(--green);stroke-width:10;filter:drop-shadow(0 0 8px var(--green-glow));animation:draw 1.1s 1.9s ease-in-out forwards}
.br-ln{stroke:rgba(255,255,255,.85);stroke-width:7;animation:draw .9s 2.5s ease-in-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.node{opacity:0;transform-origin:center;animation:nodeIn .45s cubic-bezier(.3,1.7,.5,1) forwards}
.node.g{fill:#38d52c;stroke:#dcffd6;stroke-width:4;filter:drop-shadow(0 0 8px var(--green-glow))}
.node.w{fill:#d6d6dc;stroke:#fff;stroke-width:3}
@keyframes nodeIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

.cloud{animation:pop .8s 2.6s cubic-bezier(.3,1.4,.5,1) both}
.cloud .shape{fill:#060606;stroke:#fff;stroke-width:4;animation:cloudGot var(--cycle) var(--loop) ease-in-out infinite}
@keyframes cloudGot{0%,55%,85%,100%{filter:drop-shadow(0 0 12px rgba(255,255,255,.45));stroke:#fff}68%{filter:drop-shadow(0 0 34px var(--green));stroke:var(--green)}}
.live{animation:fadeUp .6s 3s var(--ease) both}
.live rect{animation:livePulse var(--cycle) var(--loop) ease-in-out infinite}
@keyframes livePulse{0%,60%,90%,100%{filter:drop-shadow(0 0 8px var(--green-glow))}72%{filter:drop-shadow(0 0 22px var(--green))}}

.packet{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#f0fff0;box-shadow:0 0 16px 7px var(--green-glow);opacity:0;
  offset-path:path('M1440 700 Q1500 700 1540 676 Q1582 650 1604 596 Q1628 540 1652 500 Q1680 455 1700 420 L1700 392');
  offset-rotate:0deg;animation:travel var(--cycle) var(--loop) ease-in-out infinite}
@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}60%{offset-distance:100%;opacity:1}66%,100%{offset-distance:100%;opacity:0}}

/* ---------- Shared keyframes ---------- */
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeRight{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pillIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}

.hint{position:fixed;right:14px;bottom:10px;font-size:12px;color:#555;font-family:Inter,sans-serif}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .packet{display:none}
  .bubble{opacity:1}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="orb"></div>
  <div class="label"><span>GitHub Power Skills for Vibe Coders</span></div>

  <h1><span class="ln"><span>GitHub for</span></span><span class="ln"><span class="gh">Vibe Coders</span></span></h1>
  <div class="bar"></div>
  <p class="sub"><span>Understand enough to direct your AI.</span><span>No commands to memorise.</span></p>
  <div class="meta">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path class="hand" d="M12 6v6l4 2"/></svg>
    8 topics<i>·</i>under 12 minutes
  </div>

  <svg class="world" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2c31"/><stop offset="1" stop-color="#121316"/></linearGradient>
      <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8dade"/><stop offset="1" stop-color="#8e9198"/></linearGradient>
      <symbol id="gh" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></symbol>
    </defs>

    <!-- floor glow -->
    <ellipse cx="1260" cy="930" rx="360" ry="34" fill="#fff" opacity=".07"/>

    <!-- laptop with an AI chat window -->
    <g class="laptop">
      <rect x="1000" y="560" width="430" height="300" rx="18" fill="url(#lid)" stroke="#d6d9de" stroke-width="5"/>
      <rect x="1020" y="580" width="390" height="260" rx="8" fill="#060607"/>
      <rect x="1020" y="580" width="390" height="40" rx="8" fill="#141518"/>
      <circle cx="1042" cy="600" r="6" fill="#4a4c52"/><circle cx="1062" cy="600" r="6" fill="#4a4c52"/><circle cx="1082" cy="600" r="6" fill="#4a4c52"/>
      <text x="1215" y="607" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="#cfd1d6">AI Chat</text>
      <!-- user asks -->
      <g class="bubble me b1"><rect x="1190" y="636" width="200" height="44" rx="14" fill="#fff"/>
        <text x="1290" y="664" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="#111">Commit &amp; push this</text></g>
      <!-- AI answers -->
      <g class="bubble b2"><rect x="1040" y="694" width="236" height="44" rx="14" fill="#16331a" stroke="#4BF03C" stroke-width="2"/>
        <text x="1158" y="722" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#d6ffd0">✓ Committed. Pushing…</text></g>
      <g class="bubble b3"><rect x="1040" y="750" width="196" height="44" rx="14" fill="#16331a" stroke="#4BF03C" stroke-width="2"/>
        <text x="1138" y="778" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#d6ffd0">✓ Live on GitHub</text></g>
      <g class="dots" fill="#9a9aa3"><circle cx="1360" cy="812" r="5"/><circle cx="1376" cy="812" r="5"/><circle cx="1392" cy="812" r="5"/></g>
      <path d="M960 862 H1470 L1446 900 H984 Z" fill="url(#base)"/>
      <rect x="1170" y="866" width="90" height="8" rx="4" fill="#6c6f75"/>
    </g>

    <!-- commit line leaving the laptop, branching, rising to the cloud -->
    <path class="ln main-ln" pathLength="1" d="M1440 700 Q1500 700 1540 676 Q1582 650 1604 596 Q1628 540 1652 500 Q1680 455 1700 420 L1700 392"/>
    <path class="ln br-ln" pathLength="1" d="M1540 676 C1610 690 1720 684 1756 620 C1786 566 1714 520 1652 500"/>
    <circle class="node g" cx="1460" cy="698" r="15" style="animation-delay:2s"/>
    <circle class="node g" cx="1540" cy="676" r="15" style="animation-delay:2.15s"/>
    <circle class="node w" cx="1668" cy="680" r="13" style="animation-delay:2.75s"/>
    <circle class="node w" cx="1752" cy="626" r="13" style="animation-delay:2.95s"/>
    <circle class="node g" cx="1604" cy="596" r="15" style="animation-delay:2.3s"/>
    <circle class="node g" cx="1652" cy="500" r="15" style="animation-delay:2.45s"/>

    <!-- cloud / server -->
    <g class="cloud">
      <svg x="1550" y="186" width="300" height="204" viewBox="0 0 385 262" overflow="visible">
        <path class="shape" d="M85 240 A65 65 0 0 1 95 111 A98 98 0 0 1 290 111 A65 65 0 0 1 300 240 Z"/>
        <use href="#gh" x="140" y="56" width="105" height="105" fill="#fff"/>
        <text x="192" y="222" text-anchor="middle" font-family="Inter,sans-serif" font-size="50" font-weight="800" fill="#fff" letter-spacing="-1.5">GitHub</text>
      </svg>
    </g>
    <g class="live">
      <rect x="1752" y="402" width="118" height="52" rx="16" fill="#071505" stroke="#4BF03C" stroke-width="3"/>
      <circle cx="1778" cy="428" r="7" fill="#4BF03C"/>
      <text x="1826" y="440" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="800" fill="#fff">LIVE</text>
    </g>
  </svg>
  <div class="packet"></div>
</div>
<div class="hint">Click / Space to replay</div>

<script>
const stage = document.getElementById('stage');
function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
addEventListener('resize', fit); fit();

const inDeck = window.top !== window;
if(inDeck){
  document.querySelector('.hint')?.remove();
  addEventListener('click', ()=>parent.postMessage({deck:'click'},'*'));
  addEventListener('keydown', e=>{ e.preventDefault(); parent.postMessage({deck:'key',key:e.key},'*'); });
}else{
  addEventListener('click', ()=>location.reload());
  addEventListener('keydown', e=>{ if(e.code==='Space'||e.key==='r'){ e.preventDefault(); location.reload(); } });
}
</script>
<script data-src="assets/slide-no.js">
// Slide number in the header, Super Stack style: [04] GitHub Power Skills for Vibe Coders ────
// Shared by every github-slide-XX.html. The number comes from the file name, so a new
// slide only needs a script tag pointing at assets/slide-no.js and a .label header.
(function(){
  var m = location.pathname.match(/slide-(\d+)([a-z]?)\.html$/i) || (document.documentElement.getAttribute('data-slide')||'').match(/^(\d+)([a-z]?)$/i);
  if(!m) return;
  var no = String(parseInt(m[1],10)).padStart(2,'0') + (m[2]||'').toUpperCase();
  var stage = document.getElementById('stage');
  if(!stage) return;

  var old = stage.querySelector('.page');
  if(old) old.remove();

  var css = document.createElement('style');
  css.textContent =
    '.label.numbered{gap:22px}'+
    '.label.numbered::before{display:none}'+
    '.slide-no{flex:none;height:50px;min-width:72px;padding:0 14px;display:flex;align-items:center;justify-content:center;border-radius:12px;'+
      'font:800 30px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;'+
      'background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.6));border:2px solid rgba(255,255,255,.85);'+
      'box-shadow:0 0 18px rgba(255,255,255,.3),inset 0 0 12px rgba(255,255,255,.1);'+
      'animation:slideNoIn .7s .1s cubic-bezier(.3,1.5,.5,1) both}'+
    '.slide-line{position:relative;flex:none;width:520px;height:2px;margin-left:8px;'+
      'background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,.25) 60%,transparent);'+
      'transform-origin:left;animation:slideLineIn 1s .5s cubic-bezier(.2,.8,.2,1) both}'+
    '.slide-line::before{content:"";position:absolute;left:0;top:-3px;width:150px;height:8px;border-radius:8px;'+
      'background:linear-gradient(90deg,#fff,rgba(255,255,255,.4));box-shadow:0 0 14px rgba(255,255,255,.6)}'+
    '@keyframes slideNoIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}'+
    '@keyframes slideLineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}'+
    '@media (prefers-reduced-motion:reduce){.slide-no,.slide-line{animation:none}}';
  document.head.appendChild(css);

  var label = stage.querySelector('.label');
  var b = document.createElement('div');
  b.className = 'slide-no';
  b.textContent = no;
  if(label){
    label.classList.add('numbered');
    label.prepend(b);
    var line = document.createElement('i');
    line.className = 'slide-line';
    label.appendChild(line);
  }else{
    b.style.cssText = 'position:absolute;right:62px;top:22px;z-index:20';
    stage.appendChild(b);
  }
})();
</script>
</body>
</html>
