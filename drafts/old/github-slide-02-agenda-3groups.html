<!doctype html>
<html lang="en" data-slide="02">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What You Will Understand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --text:#fff;
  --body:#E8E8EC;
  --line:rgba(255,255,255,.78);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;cursor:pointer}

/* 1920×1080 stage, scaled to fit the window */
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;
  background:
    radial-gradient(1000px 520px at 50% 62%,rgba(255,255,255,.045),transparent 70%),
    var(--bg)}
.orb{position:absolute;width:700px;height:700px;border-radius:50%;left:200px;top:260px;
  background:radial-gradient(circle,rgba(255,255,255,.06),transparent 65%);filter:blur(20px);
  animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(900px,40px) scale(1.15)}}

/* ---------- Header ---------- */
.label{position:absolute;left:90px;top:58px;display:flex;align-items:center;gap:26px;
  font-size:32px;font-weight:700;letter-spacing:-.015em}
.label::before{content:"";width:2px;height:48px;background:#fff;transform-origin:top;animation:growY .6s .1s var(--ease) both}
.label span{animation:fadeRight .7s .25s var(--ease) both}

h1{position:absolute;left:106px;top:122px;margin:0;font-size:112px;line-height:130px;font-weight:900;letter-spacing:-.04em;
  overflow:hidden;padding-bottom:8px}
h1 > span{display:inline-block;animation:rise .9s .35s var(--ease) both}
.bar{position:absolute;left:106px;top:258px;width:228px;height:13px;border-radius:7px;background:#fff;
  box-shadow:0 0 18px rgba(255,255,255,.45);transform-origin:left;animation:growX .8s .8s var(--ease) both}

/* ---------- Steps ---------- */
.card{position:absolute;top:362px;width:430px;height:420px;border-radius:32px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 45%,rgba(0,0,0,.4));
  border:2px solid var(--line);
  box-shadow:0 0 22px rgba(255,255,255,.22),inset 0 0 30px rgba(255,255,255,.06);
  animation:cardIn .9s var(--ease) both, pulse 6s ease-in-out infinite}
.c1{left:90px;  animation-delay:.9s, 3s}
.c2{left:600px; animation-delay:1.1s, 4s}
.c3{left:1110px;animation-delay:1.3s, 5s}
/* the "active" glow travels 01 → 02 → 03 → LIVE */
@keyframes pulse{0%,20%,100%{box-shadow:0 0 22px rgba(255,255,255,.22),inset 0 0 30px rgba(255,255,255,.06);border-color:var(--line)}
  8%{box-shadow:0 0 46px rgba(255,255,255,.55),inset 0 0 44px rgba(255,255,255,.12);border-color:#fff}}

.num{position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:138px;height:84px;border-radius:24px;
  display:grid;place-items:center;font-size:48px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(160deg,#1c1c1f,#050505);border:2px solid var(--line);
  box-shadow:0 0 16px rgba(255,255,255,.25);overflow:hidden}
.num span{display:block;animation:numPop .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes numPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.c1 .num span{animation-delay:.95s}
.c2 .num span{animation-delay:1.15s}
.c3 .num span{animation-delay:1.35s}

.icon{height:120px;margin-top:66px;display:grid;place-items:center}
.icon svg{width:112px;height:112px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.35));overflow:visible}
.icon svg *{transform-box:fill-box;transform-origin:center}
.card h2{margin:24px 0 0;font-size:54px;line-height:62px;font-weight:800;letter-spacing:-.03em}
.card p{margin:22px 0 0;font-size:37px;line-height:46px;font-weight:500;color:var(--body);letter-spacing:-.01em;
  animation:fadeUp .7s var(--ease) both}
.c1 p{animation-delay:1.5s}
.c2 p{animation-delay:1.7s}
.c3 p{animation-delay:1.9s}

/* icon loops */
.i-layers .top{animation:stack 2.6s 2.2s ease-in-out infinite}
@keyframes stack{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.i-layers .mid{animation:stack 2.6s 2.35s ease-in-out infinite}
.i-branch .fork{stroke-dasharray:20;animation:draw 3s 2.2s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:20}35%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-20}}
.i-branch .tip{animation:blink 3s 2.2s ease-in-out infinite}
@keyframes blink{0%,25%{opacity:.25}40%,80%{opacity:1}100%{opacity:.25}}
.i-auto .cog{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.i-auto .play{fill:#fff;stroke:none}

/* ---------- Arrows ---------- */
.arrow{position:absolute;top:548px;width:52px;height:46px}
.arrow svg{width:100%;height:100%;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}
.a1{left:540px}
.a2{left:1050px}
.a3{left:1557px}
.arrow{animation:fadeRight .6s var(--ease) both, nudgeX 6s ease-in-out infinite}
.a1{animation-delay:1.4s, 3.5s}
.a2{animation-delay:1.6s, 4.5s}
.a3{animation-delay:1.8s, 5.5s}
@keyframes nudgeX{0%,16%,100%{transform:none;opacity:1}6%{transform:translateX(10px)}}

/* ---------- LIVE ---------- */
.live{position:absolute;left:1612px;top:496px;width:268px;height:124px;border-radius:62px;
  display:flex;align-items:center;justify-content:center;gap:20px;
  border:3px solid #fff;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.3));
  box-shadow:0 0 26px rgba(255,255,255,.4),inset 0 0 24px rgba(255,255,255,.08);
  font-size:54px;font-weight:900;letter-spacing:-.01em;
  animation:pop .8s 2s cubic-bezier(.3,1.5,.5,1) both, livePulse 6s 6s ease-in-out infinite}
@keyframes livePulse{0%,22%,100%{box-shadow:0 0 26px rgba(255,255,255,.4),inset 0 0 24px rgba(255,255,255,.08);transform:none}
  8%{box-shadow:0 0 60px rgba(255,255,255,.8),inset 0 0 40px rgba(255,255,255,.2);transform:scale(1.05)}}
.live svg{width:58px;height:58px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.live .w1{animation:wave 1.6s 2.6s ease-in-out infinite}
.live .w2{animation:wave 1.6s 2.85s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.live .dot{fill:#fff;stroke:none}

.rays{position:absolute;left:1690px;top:410px;width:110px;height:56px}
.rays i{position:absolute;bottom:0;left:50%;width:5px;height:34px;margin-left:-2.5px;border-radius:3px;background:#fff;
  box-shadow:0 0 10px rgba(255,255,255,.6);transform-origin:50% 66px;animation:ray 1.6s ease-in-out infinite}
.rays i:nth-child(1){transform:rotate(-38deg);animation-delay:2.6s}
.rays i:nth-child(2){transform:rotate(0);animation-delay:2.75s}
.rays i:nth-child(3){transform:rotate(38deg);animation-delay:2.9s}
.rays{animation:fadeUp .5s 2.4s var(--ease) both}
@keyframes ray{0%,100%{opacity:.35;height:28px}50%{opacity:1;height:38px}}

/* ---------- Bottom pill ---------- */
.remember{position:absolute;left:86px;top:868px;width:1756px;height:134px;border-radius:67px;display:flex;align-items:center;
  justify-content:center;animation:pillIn 1s 2.2s var(--ease) both}
.remember .logo{width:86px;height:86px;margin-left:0;animation:pop .7s 2.7s cubic-bezier(.3,1.6,.5,1) both}
.remember .logo svg{width:100%;height:100%;fill:#fff;filter:drop-shadow(0 0 10px rgba(255,255,255,.35));animation:glow 3s 3.4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 22px rgba(255,255,255,.7))}}
.remember .sep{width:2px;height:64px;background:rgba(255,255,255,.75);margin:0 44px 0 40px}
.remember p{margin:0;font-size:46px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;clip-path:inset(0 100% 0 0);
  animation:reveal 1.3s 2.85s cubic-bezier(.6,0,.2,1) forwards}
.remember p b{font-weight:800}

/* ---------- Shared keyframes ---------- */
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeRight{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pillIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}

.hint{position:fixed;right:14px;bottom:10px;font-size:12px;color:#555;font-family:Inter,sans-serif}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
.card{width:400px}
.c1{left:90px}.c2{left:600px}.c3{left:1110px}
.a1{left:520px}.a2{left:1030px}.a3{left:1540px}
.live{left:1622px;width:258px}
.rays{left:1696px}
.card p{font-size:33px;line-height:42px}
</style>
</head>
<body>

  <div class="card c1">

    <div class="icon i-layers"><svg viewBox="0 0 24 24">
      <path class="top" d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>

<script data-src="assets/base.js">
// Shared runtime for every slide: fit the 1920×1080 stage, talk to the deck, copy buttons.
(function(){
  var stage = document.getElementById('stage');
  function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
  addEventListener('resize', fit); fit();

  // clicks on buttons/links stay inside the slide; anywhere else advances the deck
  var INTERACTIVE = 'button,a,input,select,textarea,label,[data-tap]';
  var inDeck = window.top !== window;
  addEventListener('click', function(e){
    if(e.target.closest(INTERACTIVE)) return;
    if(inDeck) parent.postMessage({deck:'click'}, '*');
  });
  addEventListener('keydown', function(e){
    if(e.target.closest('input,textarea')) return;
    if(inDeck){ e.preventDefault(); parent.postMessage({deck:'key', key:e.key}, '*'); }
    else if(e.key==='r' || e.key==='R') location.reload();
  });

  // [data-copy] buttons copy the text of the element they point to
  document.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var src = document.querySelector(b.getAttribute('data-copy'));
      var text = src ? src.textContent.trim().replace(/^[“"]|[”"]$/g,'') : '';
      var done = function(){ var t=b.innerHTML; b.textContent='Copied ✓'; b.classList.add('on'); setTimeout(function(){ b.innerHTML=t; b.classList.remove('on'); },1400); };
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
      function fallback(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); }
    });
  });
})();
</script>
<script data-src="assets/slide-no.js">
// Slide number in the header, Super Stack style: [04] GitHub Power Skills for Vibe Coders ────
// Shared by every github-slide-XX.html. The number comes from the file name, so a new
// slide only needs a script tag pointing at assets/slide-no.js and a .label header.
(function(){
  var m = location.pathname.match(/slide-(\d+)([a-z]?)\.html$/i) || (document.documentElement.getAttribute('data-slide')||'').match(/^(\d+)([a-z]?)$/i);
  if(!m) return;
  var no = String(parseInt(m[1],10)).padStart(2,'0') + (m[2]||'').toUpperCase();
  var stage = document.getElementById('stage');
  if(!stage) return;

  var old = stage.querySelector('.page');
  if(old) old.remove();

  var css = document.createElement('style');
  css.textContent =
    '.label.numbered{gap:22px}'+
    '.label.numbered::before{display:none}'+
    '.slide-no{flex:none;height:50px;min-width:72px;padding:0 14px;display:flex;align-items:center;justify-content:center;border-radius:12px;'+
      'font:800 30px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;'+
      'background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.6));border:2px solid rgba(255,255,255,.85);'+
      'box-shadow:0 0 18px rgba(255,255,255,.3),inset 0 0 12px rgba(255,255,255,.1);'+
      'animation:slideNoIn .7s .1s cubic-bezier(.3,1.5,.5,1) both}'+
    '.slide-line{position:relative;flex:none;width:520px;height:2px;margin-left:8px;'+
      'background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,.25) 60%,transparent);'+
      'transform-origin:left;animation:slideLineIn 1s .5s cubic-bezier(.2,.8,.2,1) both}'+
    '.slide-line::before{content:"";position:absolute;left:0;top:-3px;width:150px;height:8px;border-radius:8px;'+
      'background:linear-gradient(90deg,#fff,rgba(255,255,255,.4));box-shadow:0 0 14px rgba(255,255,255,.6)}'+
    '@keyframes slideNoIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}'+
    '@keyframes slideLineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}'+
    '@media (prefers-reduced-motion:reduce){.slide-no,.slide-line{animation:none}}';
  document.head.appendChild(css);

  var label = stage.querySelector('.label');
  var b = document.createElement('div');
  b.className = 'slide-no';
  b.textContent = no;
  if(label){
    label.classList.add('numbered');
    label.prepend(b);
    var line = document.createElement('i');
    line.className = 'slide-line';
    label.appendChild(line);
  }else{
    b.style.cssText = 'position:absolute;right:62px;top:22px;z-index:20';
    stage.appendChild(b);
  }
})();
</script>
